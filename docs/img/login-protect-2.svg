<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 420" width="442" height="420" style="max-width:100%;height:auto;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 6 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="1" y="1" width="440" height="72" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="15" r="8" fill="#1F4E99"/><text x="18" y="18.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="34" y="19" font-size="12" font-weight="600" fill="#1F2328">Запрос на вход</text><text x="34" y="34" font-size="11" fill="#5F6672">POST на адреса входа: /uds/page/login и /uds/page/mfa</text><text x="34" y="48" font-size="11" fill="#5F6672">(портал), /admin/api/login и /admin/api/login/mfa (кабинет),</text><text x="34" y="62" font-size="11" fill="#5F6672">/my/api/password, /uds/rest/auth/login</text><path d="M18 74 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="87" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="101" r="8" fill="#1F4E99"/><text x="18" y="104.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="34" y="105" font-size="12" font-weight="600" fill="#1F2328">Настоящий адрес клиента</text><text x="34" y="120" font-size="11" fill="#5F6672">за пограничными фронтами — по протоколу PROXY; заголовку</text><text x="34" y="134" font-size="11" fill="#5F6672">X-Forwarded-For от клиента фронт не верит</text><path d="M18 146 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="159" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="173" r="8" fill="#1F4E99"/><text x="18" y="176.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="34" y="177" font-size="12" font-weight="600" fill="#1F2328">Доверенная сеть?</text><text x="34" y="192" font-size="11" fill="#5F6672">офис, VPN, узлы самой установки — не считаются и капчу не</text><text x="34" y="206" font-size="11" fill="#5F6672">получают</text><path d="M18 218 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="231" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="245" r="8" fill="#1F4E99"/><text x="18" y="248.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="34" y="249" font-size="12" font-weight="600" fill="#1F2328">Счёт</text><text x="34" y="264" font-size="11" fill="#5F6672">таблица фронта: попыток в минуту и за 10 минут на адрес</text><path d="M18 276 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="289" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="303" r="8" fill="#1F4E99"/><text x="18" y="306.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="34" y="307" font-size="12" font-weight="600" fill="#1F2328">Выше лимита</text><text x="34" y="322" font-size="11" fill="#5F6672">отказ 429 «Слишком много попыток…»; блокировка держится, пока</text><text x="34" y="336" font-size="11" fill="#5F6672">адрес не помолчит</text><path d="M18 348 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="361" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="375" r="8" fill="#1F4E99"/><text x="18" y="378.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">6</text><text x="34" y="379" font-size="12" font-weight="600" fill="#1F2328">Выше порога капчи</text><text x="34" y="394" font-size="11" fill="#5F6672">без пропуска — ответ 403 «Подтвердите, что вы не робот»;</text><text x="34" y="408" font-size="11" fill="#5F6672">страница входа показывает капчу</text></svg>