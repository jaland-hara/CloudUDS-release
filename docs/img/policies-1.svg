<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 392" width="442" height="392" style="max-width:100%;height:auto;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 6 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="1" y="1" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="15" r="8" fill="#1F4E99"/><text x="18" y="18.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="34" y="19" font-size="12" font-weight="600" fill="#1F2328">Политики → Создать</text><text x="34" y="34" font-size="11" fill="#5F6672">или измените существующую</text><path d="M18 46 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="59" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="73" r="8" fill="#1F4E99"/><text x="18" y="76.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="34" y="77" font-size="12" font-weight="600" fill="#1F2328">Устройства</text><text x="34" y="92" font-size="11" fill="#5F6672">буфер обмена, диски, принтеры, звук и микрофон, камера,</text><text x="34" y="106" font-size="11" fill="#5F6672">смарт-карты</text><path d="M18 118 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="131" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="145" r="8" fill="#1F4E99"/><text x="18" y="148.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="34" y="149" font-size="12" font-weight="600" fill="#1F2328">Качество</text><text x="34" y="164" font-size="11" fill="#5F6672">полное разрешение или «экономное» для экранов высокой</text><text x="34" y="178" font-size="11" fill="#5F6672">чёткости; все мониторы</text><path d="M18 190 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="203" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="217" r="8" fill="#1F4E99"/><text x="18" y="220.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="34" y="221" font-size="12" font-weight="600" fill="#1F2328">Экономия</text><text x="34" y="236" font-size="11" fill="#5F6672">выключать стол без подключения, завершать сеанс при</text><text x="34" y="250" font-size="11" fill="#5F6672">бездействии</text><path d="M18 262 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="275" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="289" r="8" fill="#1F4E99"/><text x="18" y="292.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="34" y="293" font-size="12" font-weight="600" fill="#1F2328">Пул → Политика</text><text x="34" y="308" font-size="11" fill="#5F6672">у каждого пула одна политика; применяется со следующего</text><text x="34" y="322" font-size="11" fill="#5F6672">подключения</text><path d="M18 334 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="347" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#D9A38A"/><circle cx="18" cy="361" r="8" fill="#A3470E"/><text x="18" y="364.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">6</text><text x="34" y="365" font-size="12" font-weight="600" fill="#1F2328">Исключения</text><text x="34" y="380" font-size="11" fill="#5F6672">персонально для сотрудника — через «Запросы» или карточку пула</text></svg>