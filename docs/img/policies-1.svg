<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 466" width="100%" style="max-width:604px;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 6 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="2" y="2" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="20" r="10" fill="#1F4E99"/><text x="26" y="24" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="46" y="25" font-size="13.5" font-weight="600" fill="#1F2328">Политики → Создать</text><text x="46" y="44" font-size="12" fill="#5F6672">или измените существующую</text><path d="M26 60 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="80" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="98" r="10" fill="#1F4E99"/><text x="26" y="102" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="46" y="103" font-size="13.5" font-weight="600" fill="#1F2328">Устройства</text><text x="46" y="122" font-size="12" fill="#5F6672">буфер обмена, диски, принтеры, звук и микрофон, камера, смарт-карты</text><path d="M26 138 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="158" width="600" height="72" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="176" r="10" fill="#1F4E99"/><text x="26" y="180" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="46" y="181" font-size="13.5" font-weight="600" fill="#1F2328">Качество</text><text x="46" y="200" font-size="12" fill="#5F6672">полное разрешение или «экономное» для экранов высокой чёткости; все</text><text x="46" y="216" font-size="12" fill="#5F6672">мониторы</text><path d="M26 232 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="252" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="270" r="10" fill="#1F4E99"/><text x="26" y="274" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="46" y="275" font-size="13.5" font-weight="600" fill="#1F2328">Экономия</text><text x="46" y="294" font-size="12" fill="#5F6672">выключать стол без подключения, завершать сеанс при бездействии</text><path d="M26 310 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="330" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="348" r="10" fill="#1F4E99"/><text x="26" y="352" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="46" y="353" font-size="13.5" font-weight="600" fill="#1F2328">Пул → Политика</text><text x="46" y="372" font-size="12" fill="#5F6672">у каждого пула одна политика; применяется со следующего подключения</text><path d="M26 388 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="408" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#D9A38A"/><circle cx="26" cy="426" r="10" fill="#A3470E"/><text x="26" y="430" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">6</text><text x="46" y="431" font-size="13.5" font-weight="600" fill="#1F2328">Исключения</text><text x="46" y="450" font-size="12" fill="#5F6672">персонально для сотрудника — через «Запросы» или карточку пула</text></svg>