<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 278" width="442" height="278" style="max-width:100%;height:auto;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 5 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="1" y="1" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="15" r="8" fill="#1F4E99"/><text x="18" y="18.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="34" y="19" font-size="12" font-weight="600" fill="#1F2328">ВМ в сети столов</text><text x="34" y="34" font-size="11" fill="#5F6672">любая ОС, нужные программы</text><path d="M18 46 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="59" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="73" r="8" fill="#1F4E99"/><text x="18" y="76.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="34" y="77" font-size="12" font-weight="600" fill="#1F2328">Образы → Свой образ</text><text x="34" y="92" font-size="11" fill="#5F6672">получите команду подготовки и выполните её в ВМ</text><path d="M18 104 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="117" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="131" r="8" fill="#1F4E99"/><text x="18" y="134.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="34" y="135" font-size="12" font-weight="600" fill="#1F2328">Выключите ВМ</text><text x="34" y="150" font-size="11" fill="#5F6672">агент UDS и агент программ уже установлены</text><path d="M18 162 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="175" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="189" r="8" fill="#1F4E99"/><text x="18" y="192.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="34" y="193" font-size="12" font-weight="600" fill="#1F2328">Добавить образ</text><text x="34" y="208" font-size="11" fill="#5F6672">выберите ВМ из списка проекта (или вставьте ID), типы дисков</text><path d="M18 220 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="233" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="247" r="8" fill="#1F4E99"/><text x="18" y="250.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="34" y="251" font-size="12" font-weight="600" fill="#1F2328">Каталоги машин</text><text x="34" y="266" font-size="11" fill="#5F6672">создайте пул из нового образа</text></svg>