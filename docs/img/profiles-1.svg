<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 306" width="442" height="306" style="max-width:100%;height:auto;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 5 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="1" y="1" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="15" r="8" fill="#1F4E99"/><text x="18" y="18.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="34" y="19" font-size="12" font-weight="600" fill="#1F2328">Вход в стол</text><text x="34" y="34" font-size="11" fill="#5F6672">сценарий входа (Windows) или PAM (Linux) до запуска программ</text><path d="M18 46 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="59" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="73" r="8" fill="#1F4E99"/><text x="18" y="76.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="34" y="77" font-size="12" font-weight="600" fill="#1F2328">Панель</text><text x="34" y="92" font-size="11" fill="#5F6672">проверяет, кому выдан стол, и даёт ссылки только на его файлы</text><path d="M18 104 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="117" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="131" r="8" fill="#1F4E99"/><text x="18" y="134.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="34" y="135" font-size="12" font-weight="600" fill="#1F2328">Загрузка</text><text x="34" y="150" font-size="11" fill="#5F6672">перенос: профиль из копии; резервная: только недостающее на</text><text x="34" y="164" font-size="11" fill="#5F6672">новом столе</text><path d="M18 176 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="189" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="203" r="8" fill="#1F4E99"/><text x="18" y="206.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="34" y="207" font-size="12" font-weight="600" fill="#1F2328">Работа</text><text x="34" y="222" font-size="11" fill="#5F6672">каждые N минут агент сохраняет изменения</text><path d="M18 234 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="247" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="261" r="8" fill="#1F4E99"/><text x="18" y="264.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="34" y="265" font-size="12" font-weight="600" fill="#1F2328">Выход</text><text x="34" y="280" font-size="11" fill="#5F6672">финальное сохранение; новые файлы уходят в S3, одинаковые не</text><text x="34" y="294" font-size="11" fill="#5F6672">повторяются</text></svg>