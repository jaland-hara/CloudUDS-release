<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 372" width="100%" style="max-width:604px;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 5 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="2" y="2" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="20" r="10" fill="#1F4E99"/><text x="26" y="24" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="46" y="25" font-size="13.5" font-weight="600" fill="#1F2328">Вход в стол</text><text x="46" y="44" font-size="12" fill="#5F6672">сценарий входа (Windows) или PAM (Linux) до запуска программ</text><path d="M26 60 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="80" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="98" r="10" fill="#1F4E99"/><text x="26" y="102" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="46" y="103" font-size="13.5" font-weight="600" fill="#1F2328">Панель</text><text x="46" y="122" font-size="12" fill="#5F6672">проверяет, кому выдан стол, и даёт ссылки только на его файлы</text><path d="M26 138 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="158" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="176" r="10" fill="#1F4E99"/><text x="26" y="180" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="46" y="181" font-size="13.5" font-weight="600" fill="#1F2328">Загрузка</text><text x="46" y="200" font-size="12" fill="#5F6672">перенос: профиль из копии; резервная: только недостающее на новом столе</text><path d="M26 216 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="236" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="254" r="10" fill="#1F4E99"/><text x="26" y="258" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="46" y="259" font-size="13.5" font-weight="600" fill="#1F2328">Работа</text><text x="46" y="278" font-size="12" fill="#5F6672">каждые N минут агент сохраняет изменения</text><path d="M26 294 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="314" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="332" r="10" fill="#1F4E99"/><text x="26" y="336" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="46" y="337" font-size="13.5" font-weight="600" fill="#1F2328">Выход</text><text x="46" y="356" font-size="12" fill="#5F6672">финальное сохранение; новые файлы уходят в S3, одинаковые не повторяются</text></svg>