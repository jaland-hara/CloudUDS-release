<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 528" width="100%" style="max-width:604px;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 7 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="2" y="2" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="20" r="10" fill="#1F4E99"/><text x="26" y="24" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="46" y="25" font-size="13.5" font-weight="600" fill="#1F2328">Включение</text><text x="46" y="44" font-size="12" fill="#5F6672">служба агента стартует вместе с системой</text><path d="M26 60 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="80" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="98" r="10" fill="#1F4E99"/><text x="26" y="102" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="46" y="103" font-size="13.5" font-weight="600" fill="#1F2328">Кто я?</text><text x="46" y="122" font-size="12" fill="#5F6672">обращается к брокеру с общим ключом образа и своим MAC</text><path d="M26 138 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="158" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="176" r="10" fill="#1F4E99"/><text x="26" y="180" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="46" y="181" font-size="13.5" font-weight="600" fill="#1F2328">Брокер</text><text x="46" y="200" font-size="12" fill="#5F6672">узнаёт стол по MAC, выдаёт личный ключ и задание</text><path d="M26 216 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="236" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="254" r="10" fill="#1F4E99"/><text x="26" y="258" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="46" y="259" font-size="13.5" font-weight="600" fill="#1F2328">Подготовка</text><text x="46" y="278" font-size="12" fill="#5F6672">имя стола, ввод в домен или пароль локальной учётки; перезагрузка</text><path d="M26 294 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="314" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="332" r="10" fill="#1F4E99"/><text x="26" y="336" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="46" y="337" font-size="13.5" font-weight="600" fill="#1F2328">Готов</text><text x="46" y="356" font-size="12" fill="#5F6672">стол в пуле, его можно выдавать</text><path d="M26 372 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="392" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="410" r="10" fill="#1F4E99"/><text x="26" y="414" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">6</text><text x="46" y="415" font-size="13.5" font-weight="600" fill="#1F2328">Вход</text><text x="46" y="434" font-size="12" fill="#5F6672">агент сообщает о сеансе: стол занят, считается экономия</text><path d="M26 450 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="470" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="488" r="10" fill="#1F4E99"/><text x="26" y="492" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">7</text><text x="46" y="493" font-size="13.5" font-weight="600" fill="#1F2328">Выход</text><text x="46" y="512" font-size="12" fill="#5F6672">стол свободен или пересоздаётся (временные)</text></svg>