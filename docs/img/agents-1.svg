<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 408" width="442" height="408" style="max-width:100%;height:auto;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 7 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="1" y="1" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="15" r="8" fill="#1F4E99"/><text x="18" y="18.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="34" y="19" font-size="12" font-weight="600" fill="#1F2328">Включение</text><text x="34" y="34" font-size="11" fill="#5F6672">служба агента стартует вместе с системой</text><path d="M18 46 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="59" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="73" r="8" fill="#1F4E99"/><text x="18" y="76.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="34" y="77" font-size="12" font-weight="600" fill="#1F2328">Кто я?</text><text x="34" y="92" font-size="11" fill="#5F6672">обращается к брокеру с общим ключом образа и своим MAC</text><path d="M18 104 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="117" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="131" r="8" fill="#1F4E99"/><text x="18" y="134.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="34" y="135" font-size="12" font-weight="600" fill="#1F2328">Брокер</text><text x="34" y="150" font-size="11" fill="#5F6672">узнаёт стол по MAC, выдаёт личный ключ и задание</text><path d="M18 162 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="175" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="189" r="8" fill="#1F4E99"/><text x="18" y="192.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="34" y="193" font-size="12" font-weight="600" fill="#1F2328">Подготовка</text><text x="34" y="208" font-size="11" fill="#5F6672">имя стола, ввод в домен или пароль локальной учётки;</text><text x="34" y="222" font-size="11" fill="#5F6672">перезагрузка</text><path d="M18 234 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="247" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="261" r="8" fill="#1F4E99"/><text x="18" y="264.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="34" y="265" font-size="12" font-weight="600" fill="#1F2328">Готов</text><text x="34" y="280" font-size="11" fill="#5F6672">стол в пуле, его можно выдавать</text><path d="M18 292 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="305" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="319" r="8" fill="#1F4E99"/><text x="18" y="322.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">6</text><text x="34" y="323" font-size="12" font-weight="600" fill="#1F2328">Вход</text><text x="34" y="338" font-size="11" fill="#5F6672">агент сообщает о сеансе: стол занят, считается экономия</text><path d="M18 350 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="363" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="377" r="8" fill="#1F4E99"/><text x="18" y="380.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">7</text><text x="34" y="381" font-size="12" font-weight="600" fill="#1F2328">Выход</text><text x="34" y="396" font-size="11" fill="#5F6672">стол свободен или пересоздаётся (временные)</text></svg>