<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 452" width="442" height="452" style="max-width:100%;height:auto;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 8 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="1" y="1" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="15" r="8" fill="#1F4E99"/><text x="18" y="18.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="34" y="19" font-size="12" font-weight="600" fill="#1F2328">Пулы столов → Создать</text><text x="34" y="34" font-size="11" fill="#5F6672">мастер из семи шагов</text><path d="M18 46 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="59" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="73" r="8" fill="#1F4E99"/><text x="18" y="76.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="34" y="77" font-size="12" font-weight="600" fill="#1F2328">Где создавать</text><text x="34" y="92" font-size="11" fill="#5F6672">VK Cloud (или vSphere, если подключена опция)</text><path d="M18 104 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="117" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="131" r="8" fill="#1F4E99"/><text x="18" y="134.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="34" y="135" font-size="12" font-weight="600" fill="#1F2328">Образ</text><text x="34" y="150" font-size="11" fill="#5F6672">из каталога; для vSphere — только образы с эталонной ВМ</text><path d="M18 162 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="175" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="189" r="8" fill="#1F4E99"/><text x="18" y="192.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="34" y="193" font-size="12" font-weight="600" fill="#1F2328">Как создавать</text><text x="34" y="208" font-size="11" fill="#5F6672">vSphere: связанные, полные или мгновенные клоны, профиль vGPU</text><path d="M18 220 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="233" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="247" r="8" fill="#1F4E99"/><text x="18" y="250.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="34" y="251" font-size="12" font-weight="600" fill="#1F2328">Конфигурация</text><text x="34" y="266" font-size="11" fill="#5F6672">размер S/M/L или свой, тип диска или хранилище, сеть</text><path d="M18 278 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="291" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="305" r="8" fill="#1F4E99"/><text x="18" y="308.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">6</text><text x="34" y="309" font-size="12" font-weight="600" fill="#1F2328">Количество</text><text x="34" y="324" font-size="11" fill="#5F6672">готовых столов, максимум; личные постоянные или временные</text><path d="M18 336 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="349" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="363" r="8" fill="#1F4E99"/><text x="18" y="366.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">7</text><text x="34" y="367" font-size="12" font-weight="600" fill="#1F2328">Доступ и устройства</text><text x="34" y="382" font-size="11" fill="#5F6672">группы, способ входа (домен / без домена), политика</text><path d="M18 394 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="407" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#D9A38A"/><circle cx="18" cy="421" r="8" fill="#A3470E"/><text x="18" y="424.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">8</text><text x="34" y="425" font-size="12" font-weight="600" fill="#1F2328">Создать</text><text x="34" y="440" font-size="11" fill="#5F6672">первые столы — через 3–10 минут</text></svg>