<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 190" width="100%" style="max-width:890px;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 8 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="2" y="2" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="18" r="10" fill="#1F4E99"/><text x="18" y="22" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="34" y="23" font-size="12.5" font-weight="600" fill="#1F2328">Пулы столов → Создать</text><text x="12" y="44" font-size="11.5" fill="#5F6672">мастер из семи шагов</text><path d="M202 41 h24" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="232" y="2" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="248" cy="18" r="10" fill="#1F4E99"/><text x="248" y="22" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="264" y="23" font-size="12.5" font-weight="600" fill="#1F2328">Где создавать</text><text x="242" y="44" font-size="11.5" fill="#5F6672">VK Cloud (или vSphere, если</text><text x="242" y="58" font-size="11.5" fill="#5F6672">подключена опция)</text><path d="M432 41 h24" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="462" y="2" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="478" cy="18" r="10" fill="#1F4E99"/><text x="478" y="22" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="494" y="23" font-size="12.5" font-weight="600" fill="#1F2328">Образ</text><text x="472" y="44" font-size="11.5" fill="#5F6672">из каталога; для vSphere —</text><text x="472" y="58" font-size="11.5" fill="#5F6672">только образы с эталонной ВМ</text><path d="M662 41 h24" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="692" y="2" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="708" cy="18" r="10" fill="#1F4E99"/><text x="708" y="22" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="724" y="23" font-size="12.5" font-weight="600" fill="#1F2328">Как создавать</text><text x="702" y="44" font-size="11.5" fill="#5F6672">vSphere: связанные, полные или</text><text x="702" y="58" font-size="11.5" fill="#5F6672">мгновенные клоны, профиль vGPU</text><path d="M790 83 v10 H100 v12" fill="none" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="110" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="126" r="10" fill="#1F4E99"/><text x="18" y="130" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="34" y="131" font-size="12.5" font-weight="600" fill="#1F2328">Конфигурация</text><text x="12" y="152" font-size="11.5" fill="#5F6672">размер S/M/L или свой, тип</text><text x="12" y="166" font-size="11.5" fill="#5F6672">диска или хранилище, сеть</text><path d="M202 149 h24" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="232" y="110" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="248" cy="126" r="10" fill="#1F4E99"/><text x="248" y="130" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">6</text><text x="264" y="131" font-size="12.5" font-weight="600" fill="#1F2328">Количество</text><text x="242" y="152" font-size="11.5" fill="#5F6672">готовых столов, максимум;</text><text x="242" y="166" font-size="11.5" fill="#5F6672">личные постоянные или</text><text x="242" y="180" font-size="11.5" fill="#5F6672">временные</text><path d="M432 149 h24" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="462" y="110" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="478" cy="126" r="10" fill="#1F4E99"/><text x="478" y="130" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">7</text><text x="494" y="131" font-size="12.5" font-weight="600" fill="#1F2328">Доступ и устройства</text><text x="472" y="152" font-size="11.5" fill="#5F6672">группы, способ входа (домен /</text><text x="472" y="166" font-size="11.5" fill="#5F6672">без домена), политика</text><path d="M662 149 h24" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="692" y="110" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#D9A38A"/><circle cx="708" cy="126" r="10" fill="#A3470E"/><text x="708" y="130" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">8</text><text x="724" y="131" font-size="12.5" font-weight="600" fill="#1F2328">Создать</text><text x="702" y="152" font-size="11.5" fill="#5F6672">первые столы — через 3–10</text><text x="702" y="166" font-size="11.5" fill="#5F6672">минут</text></svg>