<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 606" width="100%" style="max-width:604px;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 8 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="2" y="2" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="20" r="10" fill="#1F4E99"/><text x="26" y="24" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="46" y="25" font-size="13.5" font-weight="600" fill="#1F2328">Пулы столов → Создать</text><text x="46" y="44" font-size="12" fill="#5F6672">мастер из семи шагов</text><path d="M26 60 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="80" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="98" r="10" fill="#1F4E99"/><text x="26" y="102" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="46" y="103" font-size="13.5" font-weight="600" fill="#1F2328">Где создавать</text><text x="46" y="122" font-size="12" fill="#5F6672">VK Cloud (или vSphere, если подключена опция)</text><path d="M26 138 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="158" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="176" r="10" fill="#1F4E99"/><text x="26" y="180" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="46" y="181" font-size="13.5" font-weight="600" fill="#1F2328">Образ</text><text x="46" y="200" font-size="12" fill="#5F6672">из каталога; для vSphere — только образы с эталонной ВМ</text><path d="M26 216 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="236" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="254" r="10" fill="#1F4E99"/><text x="26" y="258" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="46" y="259" font-size="13.5" font-weight="600" fill="#1F2328">Как создавать</text><text x="46" y="278" font-size="12" fill="#5F6672">vSphere: связанные, полные или мгновенные клоны, профиль vGPU</text><path d="M26 294 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="314" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="332" r="10" fill="#1F4E99"/><text x="26" y="336" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="46" y="337" font-size="13.5" font-weight="600" fill="#1F2328">Конфигурация</text><text x="46" y="356" font-size="12" fill="#5F6672">размер S/M/L или свой, тип диска или хранилище, сеть</text><path d="M26 372 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="392" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="410" r="10" fill="#1F4E99"/><text x="26" y="414" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">6</text><text x="46" y="415" font-size="13.5" font-weight="600" fill="#1F2328">Количество</text><text x="46" y="434" font-size="12" fill="#5F6672">готовых столов, максимум; личные постоянные или временные</text><path d="M26 450 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="470" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="488" r="10" fill="#1F4E99"/><text x="26" y="492" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">7</text><text x="46" y="493" font-size="13.5" font-weight="600" fill="#1F2328">Доступ и устройства</text><text x="46" y="512" font-size="12" fill="#5F6672">группы, способ входа (домен / без домена), политика</text><path d="M26 528 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="548" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#D9A38A"/><circle cx="26" cy="566" r="10" fill="#A3470E"/><text x="26" y="570" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">8</text><text x="46" y="571" font-size="13.5" font-weight="600" fill="#1F2328">Создать</text><text x="46" y="590" font-size="12" fill="#5F6672">первые столы — через 3–10 минут</text></svg>