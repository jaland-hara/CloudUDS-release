<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640"><style>
.h1{font:700 30px Arial,Helvetica,sans-serif;fill:#1C2430}.h2{font:16px Arial,Helvetica,sans-serif;fill:#4A5565}
.zt{font:700 19px Arial,Helvetica,sans-serif}.bt{font:700 16px Arial,Helvetica,sans-serif}.bs{font:14px Arial,Helvetica,sans-serif}
.vn{font:700 15px Arial,Helvetica,sans-serif;fill:#1C2430}.vr{font:13px Arial,Helvetica,sans-serif;fill:#4A5565}
.vp{font:12.5px Arial,Helvetica,sans-serif;fill:#8A1C1C}.ip{font:700 13px Consolas,Menlo,monospace}
.al{font:13px Arial,Helvetica,sans-serif;fill:#3A4556}.note{font:italic 14px Arial,Helvetica,sans-serif;fill:#6B7684}
.th{font:700 14px Arial,Helvetica,sans-serif;fill:#1C2430}.td{font:14px Arial,Helvetica,sans-serif;fill:#1C2430}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><rect width="1300" height="640" fill="#FFFFFF"/><text x="40" y="50" class="h1">Минимальная установка</text><text x="40" y="74" class="h2">Пилот или небольшой офис: всё на одной ВМ, без отказоустойчивости. До ~50 столов.</text><rect x="20" y="100" width="210" height="330" rx="16" fill="#FDF1E3" stroke="#C46A00" stroke-width="2" stroke-dasharray="8 6"/><text x="36" y="130" class="zt" fill="#C46A00">Сотрудники</text><circle cx="125" cy="160" r="11" fill="#6B7684"/><line x1="125" y1="171" x2="125" y2="202" stroke="#6B7684" stroke-width="3"/><line x1="107" y1="182" x2="143" y2="182" stroke="#6B7684" stroke-width="3"/><line x1="125" y1="202" x2="110" y2="224" stroke="#6B7684" stroke-width="3"/><line x1="125" y1="202" x2="140" y2="224" stroke="#6B7684" stroke-width="3"/><text x="125" y="244" class="vn" text-anchor="middle">клиент UDS</text><text x="125" y="261" class="vn" text-anchor="middle">или браузер</text><rect x="260" y="100" width="380" height="330" rx="16" fill="#EAF0FD" stroke="#2458D6" stroke-width="2" stroke-dasharray="8 6"/><text x="276" y="130" class="zt" fill="#2458D6">Сервер VDI (1 ВМ)</text><rect x="285" y="150" width="330" height="250" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="295" y="172" class="vn" text-anchor="start">vdi-01</text><text x="295" y="191" class="vr" text-anchor="start">Ubuntu 24.04, Docker</text><text x="295" y="209" class="vr" text-anchor="start">• портал, кабинет администратора</text><text x="295" y="226" class="vr" text-anchor="start">• брокер UDS (веб, REST, задачи)</text><text x="295" y="243" class="vr" text-anchor="start">• СУБД MariaDB</text><text x="295" y="260" class="vr" text-anchor="start">• туннель UDS</text><text x="295" y="277" class="vr" text-anchor="start">• шлюз HTML5 (Guacamole)</text><text x="295" y="294" class="vr" text-anchor="start"></text><text x="295" y="311" class="vr" text-anchor="start">8 vCPU · 16 ГБ · 100 ГБ</text><rect x="670" y="100" width="290" height="330" rx="16" fill="#E9F6EE" stroke="#1B7F3B" stroke-width="2" stroke-dasharray="8 6"/><text x="686" y="130" class="zt" fill="#1B7F3B">Сеть столов</text><rect x="704" y="141" width="240" height="120" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><rect x="695" y="150" width="240" height="120" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="705" y="172" class="vn" text-anchor="start">Рабочие столы</text><text x="705" y="191" class="vr" text-anchor="start">Windows / Linux, пул</text><text x="705" y="209" class="vr" text-anchor="start">агент UDS</text><text x="705" y="226" class="vr" text-anchor="start">агент «Программы и настройки»</text><rect x="901" y="130" width="42" height="22" rx="11" fill="#3A4556"/><text x="922" y="146" class="bs" fill="#FFFFFF" text-anchor="middle" font-weight="700">×N</text><rect x="990" y="100" width="290" height="330" rx="16" fill="#E6F4F2" stroke="#0F766E" stroke-width="2" stroke-dasharray="8 6"/><text x="1006" y="130" class="zt" fill="#0F766E">Инфраструктура</text><rect x="1015" y="150" width="240" height="90" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="1025" y="172" class="vn" text-anchor="start">Контроллер домена</text><text x="1025" y="191" class="vr" text-anchor="start">AD / LDAP</text><text x="1025" y="209" class="vr" text-anchor="start">учётки, группы, ввод в домен</text><rect x="1015" y="280" width="240" height="110" rx="8" fill="#F1F3F6" stroke="#6B7684" stroke-width="2"/><text x="1025" y="302" class="vn" text-anchor="start">Платформа столов</text><text x="1025" y="321" class="vr" text-anchor="start">API VK Cloud</text><text x="1025" y="339" class="vr" text-anchor="start">опция: vCenter (vSphere)</text><path d="M145,173.0 L285,173.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="197.9" y="162.0" width="34.2" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="215.0" y="178.0" class="al" text-anchor="middle">443</text><path d="M615,180.0 L695,180.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="615.4" y="169.0" width="71.2" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="651.0" y="185.0" class="al" text-anchor="middle">RDP 3389</text><path d="M615,262.5 L655,262.5 L655,246.0 L695,246.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="610.5" y="251.5" width="49.0" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="635.0" y="267.5" class="al" text-anchor="middle">43910</text><path d="M615,380 L1000,380 L1000,335.0 L1015,335.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="775.6" y="369.0" width="63.800000000000004" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="807.5" y="385.0" class="al" text-anchor="middle">API 443</text><path d="M615,360 L985,360 L985,195.0 L1015,195.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="805.1" y="349.0" width="78.60000000000001" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="844.4" y="365.0" class="al" text-anchor="middle">LDAPS 636</text><rect x="20" y="470" width="1260" height="120" fill="#FFFFFF" stroke="#C9CED6"/><rect x="20" y="470" width="1260" height="30" fill="#EEF1F6"/><text x="30" y="490" class="th">Откуда → куда</text><text x="360" y="490" class="th">Порт</text><text x="690" y="490" class="th">Зачем</text><line x1="20" y1="500" x2="1280" y2="500" stroke="#E3E6EB"/><text x="30" y="520" class="td">сотрудник → сервер VDI</text><text x="360" y="520" class="td">443</text><text x="690" y="520" class="td">портал, вход, клиент UDS (туннель), браузер</text><line x1="20" y1="530" x2="1280" y2="530" stroke="#E3E6EB"/><text x="30" y="550" class="td">сервер VDI → столы</text><text x="360" y="550" class="td">3389, 43910</text><text x="690" y="550" class="td">RDP сеанса; агент UDS</text><line x1="20" y1="560" x2="1280" y2="560" stroke="#E3E6EB"/><text x="30" y="580" class="td">сервер VDI → домен, платформа</text><text x="360" y="580" class="td">636, 443</text><text x="690" y="580" class="td">вход сотрудников; создание и питание столов</text></svg>