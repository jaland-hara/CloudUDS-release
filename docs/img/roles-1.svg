<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 434" width="442" height="434" style="max-width:100%;height:auto;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 6 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="1" y="1" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="15" r="8" fill="#1F4E99"/><text x="18" y="18.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="34" y="19" font-size="12" font-weight="600" fill="#1F2328">Пароль проверяет UDS</text><text x="34" y="34" font-size="11" fill="#5F6672">вход учётной записью домена или собственного пользователя; имя</text><text x="34" y="48" font-size="11" fill="#5F6672">в любой форме: user, user@домен, ДОМЕН\user</text><path d="M18 60 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="73" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="87" r="8" fill="#1F4E99"/><text x="18" y="90.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="34" y="91" font-size="12" font-weight="600" fill="#1F2328">Есть ли человек в кабинете</text><text x="34" y="106" font-size="11" fill="#5F6672">список «Администраторы» (назначенные вручную важнее) или</text><text x="34" y="120" font-size="11" fill="#5F6672">группа домена; нет — отказ, хотя пароль верный</text><path d="M18 132 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="145" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="159" r="8" fill="#1F4E99"/><text x="18" y="162.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="34" y="163" font-size="12" font-weight="600" fill="#1F2328">Роль</text><text x="34" y="178" font-size="11" fill="#5F6672">по группам — сильнейшая из групп, пересчитывается при каждом</text><text x="34" y="192" font-size="11" fill="#5F6672">входе; вышел из группы — роли нет</text><path d="M18 204 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="217" width="440" height="72" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="231" r="8" fill="#1F4E99"/><text x="18" y="234.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="34" y="235" font-size="12" font-weight="600" fill="#1F2328">Права в UDS по роли</text><text x="34" y="250" font-size="11" fill="#5F6672">Администратор: права администратора UDS (выдаются, если</text><text x="34" y="264" font-size="11" fill="#5F6672">сняты); остальные: права снимаются, токен UDS закрывается</text><text x="34" y="278" font-size="11" fill="#5F6672">сразу</text><path d="M18 290 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="303" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="317" r="8" fill="#1F4E99"/><text x="18" y="320.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="34" y="321" font-size="12" font-weight="600" fill="#1F2328">Второй фактор</text><text x="34" y="336" font-size="11" fill="#5F6672">если требуется всем, роли или человеку</text><path d="M18 348 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="361" width="440" height="72" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="375" r="8" fill="#1F4E99"/><text x="18" y="378.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">6</text><text x="34" y="379" font-size="12" font-weight="600" fill="#1F2328">Сеанс кабинета</text><text x="34" y="394" font-size="11" fill="#5F6672">в браузере — случайный идентификатор (cookie только для</text><text x="34" y="408" font-size="11" fill="#5F6672">/admin, HTTPS, SameSite=Strict); роль и токен — на сервере, в</text><text x="34" y="422" font-size="11" fill="#5F6672">базе кабинета; 8 часов</text></svg>