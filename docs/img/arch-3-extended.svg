</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><rect width="1640" height="880" fill="#FFFFFF"/><text x="40" y="50" class="h1">Расширенная установка — вход из интернета</text><text x="40" y="74" class="h2">Стандартный контур + DMZ: пограничные фронты и внешние туннели с FIP; публичные имена — DNS-балансировка VK Cloud с проверкой TCP 443.</text><rect x="20" y="100" width="220" height="520" rx="16" fill="#FDF1E3" stroke="#C46A00" stroke-width="2" stroke-dasharray="8 6"/><text x="36" y="130" class="zt" fill="#C46A00">Интернет</text><circle cx="120" cy="175" r="11" fill="#6B7684"/><line x1="120" y1="186" x2="120" y2="217" stroke="#6B7684" stroke-width="3"/><line x1="102" y1="197" x2="138" y2="197" stroke="#6B7684" stroke-width="3"/><line x1="120" y1="217" x2="105" y2="239" stroke="#6B7684" stroke-width="3"/><line x1="120" y1="217" x2="135" y2="239" stroke="#6B7684" stroke-width="3"/><text x="120" y="259" class="vn" text-anchor="middle">сотрудник</text><text x="120" y="276" class="vn" text-anchor="middle">вне офиса</text><rect x="35" y="330" width="190" height="150" rx="8" fill="#F1F3F6" stroke="#6B7684" stroke-width="2"/><text x="45" y="352" class="vn" text-anchor="start">DNS VK Cloud</text><text x="45" y="371" class="vr" text-anchor="start">поддомен делегирован</text><text x="45" y="389" class="vr" text-anchor="start">my → FIP фронтов DMZ</text><text x="45" y="406" class="vr" text-anchor="start">tun → FIP туннелей DMZ</text><text x="45" y="423" class="vr" text-anchor="start">проверка TCP 443:</text><text x="45" y="440" class="vr" text-anchor="start">упавший узел — из ответа</text><rect x="270" y="100" width="250" height="520" rx="16" fill="#F1F3F6" stroke="#6B7684" stroke-width="2" stroke-dasharray="8 6"/><text x="286" y="130" class="zt" fill="#6B7684">DMZ</text><rect x="299" y="141" width="210" height="120" rx="8" fill="#FFF7E6" stroke="#C46A00" stroke-width="2"/><rect x="290" y="150" width="210" height="120" rx="8" fill="#FFF7E6" stroke="#C46A00" stroke-width="2"/><text x="300" y="172" class="vn" text-anchor="start">Пограничные фронты</text><text x="300" y="191" class="vr" text-anchor="start">HAProxy, FIP у каждого</text><text x="300" y="209" class="vr" text-anchor="start">443 → фронты :8443</text><text x="300" y="226" class="vr" text-anchor="start">PROXY-протокол</text><rect x="466" y="130" width="42" height="22" rx="11" fill="#C46A00"/><text x="487" y="146" class="bs" fill="#FFFFFF" text-anchor="middle" font-weight="700">×2</text><rect x="299" y="371" width="210" height="120" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><rect x="290" y="380" width="210" height="120" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="300" y="402" class="vn" text-anchor="start">Внешние туннели</text><text x="300" y="421" class="vr" text-anchor="start">туннель UDS, FIP</text><text x="300" y="439" class="vr" text-anchor="start">та же группа, что</text><text x="300" y="456" class="vr" text-anchor="start">и туннели контура</text><rect x="466" y="360" width="42" height="22" rx="11" fill="#3A4556"/><text x="487" y="376" class="bs" fill="#FFFFFF" text-anchor="middle" font-weight="700">×2</text><rect x="550" y="100" width="520" height="520" rx="16" fill="#EAF0FD" stroke="#2458D6" stroke-width="2" stroke-dasharray="8 6"/><text x="566" y="130" class="zt" fill="#2458D6">Контур (стандартная установка)</text><rect x="579" y="141" width="210" height="120" rx="8" fill="#FFF7E6" stroke="#C46A00" stroke-width="2"/><rect x="570" y="150" width="210" height="120" rx="8" fill="#FFF7E6" stroke="#C46A00" stroke-width="2"/><text x="580" y="172" class="vn" text-anchor="start">Фронты</text><text x="580" y="191" class="vr" text-anchor="start">VIP · :443 и :8443</text><text x="580" y="209" class="vr" text-anchor="start">сертификаты LE и CA</text><text x="580" y="226" class="vr" text-anchor="start">из кабинета</text><rect x="746" y="130" width="42" height="22" rx="11" fill="#C46A00"/><text x="767" y="146" class="bs" fill="#FFFFFF" text-anchor="middle" font-weight="700">×2</text><rect x="849" y="141" width="210" height="120" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><rect x="840" y="150" width="210" height="120" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="850" y="172" class="vn" text-anchor="start">Брокеры + кабинет</text><text x="850" y="191" class="vr" text-anchor="start">ведёт записи DNS</text><text x="850" y="208" class="vr" text-anchor="start">и проверки (VK DNS)</text><rect x="1016" y="130" width="42" height="22" rx="11" fill="#3A4556"/><text x="1037" y="146" class="bs" fill="#FFFFFF" text-anchor="middle" font-weight="700">×2</text><rect x="579" y="371" width="210" height="120" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><rect x="570" y="380" width="210" height="120" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="580" y="402" class="vn" text-anchor="start">Туннели контура</text><text x="580" y="421" class="vr" text-anchor="start">VIP для корп. сети</text><rect x="746" y="360" width="42" height="22" rx="11" fill="#3A4556"/><text x="767" y="376" class="bs" fill="#FFFFFF" text-anchor="middle" font-weight="700">×2</text><rect x="849" y="291" width="210" height="80" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><rect x="840" y="300" width="210" height="80" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="850" y="322" class="vn" text-anchor="start">Шлюзы HTML5</text><text x="850" y="341" class="vr" text-anchor="start">Guacamole</text><rect x="1016" y="280" width="42" height="22" rx="11" fill="#3A4556"/><text x="1037" y="296" class="bs" fill="#FFFFFF" text-anchor="middle" font-weight="700">×2</text><path d="M879,421 v120 a75.0,10 0 0 0 150,0 v-120 a75.0,10 0 0 0 -150,0 a75.0,10 0 0 0 150,0" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><path d="M870,430 v120 a75.0,10 0 0 0 150,0 v-120 a75.0,10 0 0 0 -150,0 a75.0,10 0 0 0 150,0" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><text x="880" y="454" class="vn" text-anchor="start">Galera</text><rect x="986" y="400" width="42" height="22" rx="11" fill="#2458D6"/><text x="1007" y="416" class="bs" fill="#FFFFFF" text-anchor="middle" font-weight="700">×3</text><rect x="1100" y="100" width="520" height="520" rx="16" fill="#E9F6EE" stroke="#1B7F3B" stroke-width="2" stroke-dasharray="8 6"/><text x="1116" y="130" class="zt" fill="#1B7F3B">Столы и инфраструктура</text><rect x="1134" y="141" width="210" height="250" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><rect x="1125" y="150" width="210" height="250" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="1135" y="172" class="vn" text-anchor="start">Рабочие столы</text><text x="1135" y="191" class="vr" text-anchor="start">RDP — только с туннелей</text><text x="1135" y="208" class="vr" text-anchor="start">и шлюзов</text><rect x="1301" y="130" width="42" height="22" rx="11" fill="#3A4556"/><text x="1322" y="146" class="bs" fill="#FFFFFF" text-anchor="middle" font-weight="700">×N</text><rect x="1394" y="141" width="210" height="100" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><rect x="1385" y="150" width="210" height="100" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="1395" y="205.0" class="vn" text-anchor="start">Домен, DNS, CA</text><rect x="1561" y="130" width="42" height="22" rx="11" fill="#3A4556"/><text x="1582" y="146" class="bs" fill="#FFFFFF" text-anchor="middle" font-weight="700">×2</text><rect x="1385" y="300" width="210" height="100" rx="8" fill="#F1F3F6" stroke="#6B7684" stroke-width="2"/><text x="1395" y="322" class="vn" text-anchor="start">API VK Cloud</text><text x="1395" y="341" class="vr" text-anchor="start">столы, VIP, DNS</text><path d="M120,292 L120,330" fill="none" stroke="#3A4556" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="130" y="316" class="al" text-anchor="start">имя → адрес</text><path d="M140,172.0 L290,172.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="197.9" y="161.0" width="34.2" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="215.0" y="177.0" class="al" text-anchor="middle">443</text><path d="M142,205 L255,205 L255,440 L290,440" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="197.2" y="264.5" width="115.60000000000001" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="255.0" y="280.5" class="al" text-anchor="middle">клиент UDS 443</text><path d="M500,198.0 L570,198.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="514.2" y="187.0" width="41.6" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="535.0" y="203.0" class="al" text-anchor="middle">8443</text><path d="M780,198.0 L840,198.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><path d="M780,246.0 L810,246.0 L810,340.0 L840,340.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="789.2" y="282.0" width="41.6" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="810.0" y="298.0" class="al" text-anchor="middle">8080</text><path d="M395.0,500 L395,600 L1230,600 L1230,400" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="1094.2" y="589.0" width="71.2" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1129.8" y="605.0" class="al" text-anchor="middle">RDP 3389</text><path d="M675.0,500 L675,600" fill="none" stroke="#3A4556" stroke-width="2"/><path d="M1050,340.0 L1125,340.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="1070.4" y="329.0" width="34.2" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1087.5" y="345.0" class="al" text-anchor="middle">RDP</text><path d="M1050,255 L1062,255 L1062,490 L1020,490" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="1041.2" y="420.25" width="41.6" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1062.0" y="436.25" class="al" text-anchor="middle">3306</text><path d="M945.0,150 L945,92 L1490,92 L1490,150" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="1094.1" y="81.0" width="137.8" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1163.0" y="97.0" class="al" text-anchor="middle">LDAPS · API · DNS</text><path d="M1490,92 L1612,92 L1612,350.0 L1595,350.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="660" width="1580" height="150" fill="#FFFFFF" stroke="#C9CED6"/><rect x="20" y="660" width="1580" height="30" fill="#EEF1F6"/><text x="30" y="680" class="th">Откуда → куда</text><text x="450" y="680" class="th">Порт</text><text x="680" y="680" class="th">Зачем</text><line x1="20" y1="690" x2="1600" y2="690" stroke="#E3E6EB"/><text x="30" y="710" class="td">интернет → пограничные фронты / внешние туннели</text><text x="450" y="710" class="td">443 / 443</text><text x="680" y="710" class="td">портал и браузер / клиент UDS</text><line x1="20" y1="720" x2="1600" y2="720" stroke="#E3E6EB"/><text x="30" y="740" class="td">пограничные фронты → VIP внутренних фронтов</text><text x="450" y="740" class="td">8443 (PROXY), 443</text><text x="680" y="740" class="td">сеансы с настоящим адресом клиента; агент узла</text><line x1="20" y1="750" x2="1600" y2="750" stroke="#E3E6EB"/><text x="30" y="770" class="td">внешние туннели → VIP фронтов; → столы</text><text x="450" y="770" class="td">443; 3389</text><text x="680" y="770" class="td">тикеты, регистрация; RDP</text><line x1="20" y1="780" x2="1600" y2="780" stroke="#E3E6EB"/><text x="30" y="800" class="td">кабинет → API DNS VK Cloud</text><text x="450" y="800" class="td">443</text><text x="680" y="800" class="td">A-записи по FIP, группы балансировки, проверки TCP 443</text></svg>