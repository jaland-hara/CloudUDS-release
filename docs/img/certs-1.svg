<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 388" width="100%" style="max-width:604px;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 5 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="2" y="2" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="20" r="10" fill="#1F4E99"/><text x="26" y="24" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="46" y="25" font-size="13.5" font-weight="600" fill="#1F2328">Сертификаты</text><text x="46" y="44" font-size="12" fill="#5F6672">срок действия текущего и имена</text><path d="M26 60 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="80" width="600" height="72" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="98" r="10" fill="#1F4E99"/><text x="26" y="102" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="46" y="103" font-size="13.5" font-weight="600" fill="#1F2328">Автоматически</text><text x="46" y="122" font-size="12" fill="#5F6672">Let’s Encrypt с проверкой через DNS Cloudflare: API-токен с правом</text><text x="46" y="138" font-size="12" fill="#5F6672">Zone.DNS:Edit</text><path d="M26 154 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="174" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="192" r="10" fill="#1F4E99"/><text x="26" y="196" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="46" y="197" font-size="13.5" font-weight="600" fill="#1F2328">Выпустить</text><text x="46" y="216" font-size="12" fill="#5F6672">сначала тестовый (staging), затем боевой с «сразу включить»</text><path d="M26 232 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="252" width="600" height="56" rx="4" fi