<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 306" width="442" height="306" style="max-width:100%;height:auto;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 5 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="1" y="1" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="15" r="8" fill="#1F4E99"/><text x="18" y="18.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="34" y="19" font-size="12" font-weight="600" fill="#1F2328">Сотрудник на портале</text><text x="34" y="34" font-size="11" fill="#5F6672">просит: больше ресурсов, другой диск, не выключать стол по</text><text x="34" y="48" font-size="11" fill="#5F6672">простою</text><path d="M18 60 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="73" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="87" r="8" fill="#1F4E99"/><text x="18" y="90.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="34" y="91" font-size="12" font-weight="600" fill="#1F2328">Уведомление</text><text x="34" y="106" font-size="11" fill="#5F6672">почта / Telegram, если включено событие «Новая заявка»</text><path d="M18 118 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="131" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="145" r="8" fill="#1F4E99"/><text x="18" y="148.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="34" y="149" font-size="12" font-weight="600" fill="#1F2328">Работа → Запросы</text><text x="34" y="164" font-size="11" fill="#5F6672">одобрить, отклонить или выдать другой пул персонально</text><path d="M18 176 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="189" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#D9A38A"/><circle cx="18" cy="203" r="8" fill="#A3470E"/><text x="18" y="206.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="34" y="207" font-size="12" font-weight="600" fill="#1F2328">Ресурсы</text><text x="34" y="222" font-size="11" fill="#5F6672">панель выключит стол, сменит конфигурацию и включит — когда</text><text x="34" y="236" font-size="11" fill="#5F6672">сотрудник нажмёт «Применить» или сразу по вашей кнопке</text><path d="M18 248 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="261" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="275" r="8" fill="#1F4E99"/><text x="18" y="278.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="34" y="279" font-size="12" font-weight="600" fill="#1F2328">Простой</text><text x="34" y="294" font-size="11" fill="#5F6672">одобрение = персональное исключение из политики пула</text></svg>