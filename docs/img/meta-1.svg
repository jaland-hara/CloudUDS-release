<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 392" width="442" height="392" style="max-width:100%;height:auto;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 6 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="1" y="1" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="15" r="8" fill="#1F4E99"/><text x="18" y="18.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="34" y="19" font-size="12" font-weight="600" fill="#1F2328">Мета-пулы → Создать</text><text x="34" y="34" font-size="11" fill="#5F6672">название значка, правило выдачи, пулы с одной ОС и одинаковым</text><text x="34" y="48" font-size="11" fill="#5F6672">входом</text><path d="M18 60 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="73" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="87" r="8" fill="#1F4E99"/><text x="18" y="90.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="34" y="91" font-size="12" font-weight="600" fill="#1F2328">Группы</text><text x="34" y="106" font-size="11" fill="#5F6672">группы всех пулов становятся группами значка и добавляются в</text><text x="34" y="120" font-size="11" fill="#5F6672">каждый пул</text><path d="M18 132 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="145" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="159" r="8" fill="#1F4E99"/><text x="18" y="162.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="34" y="163" font-size="12" font-weight="600" fill="#1F2328">Портал</text><text x="34" y="178" font-size="11" fill="#5F6672">вместо отдельных пулов сотрудник видит один значок: «через</text><text x="34" y="192" font-size="11" fill="#5F6672">приложение» и «в браузере»</text><path d="M18 204 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="217" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="231" r="8" fill="#1F4E99"/><text x="18" y="234.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="34" y="235" font-size="12" font-weight="600" fill="#1F2328">Свой стол</text><text x="34" y="250" font-size="11" fill="#5F6672">у кого стол уже есть в любом из пулов — получает его же</text><path d="M18 262 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="275" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="289" r="8" fill="#1F4E99"/><text x="18" y="292.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="34" y="293" font-size="12" font-weight="600" fill="#1F2328">Запасной пул</text><text x="34" y="308" font-size="11" fill="#5F6672">кнопка создаёт пул по образцу на другом диске или в другой</text><text x="34" y="322" font-size="11" fill="#5F6672">сети</text><path d="M18 334 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="347" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#D9A38A"/><circle cx="18" cy="361" r="8" fill="#A3470E"/><text x="18" y="364.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">6</text><text x="34" y="365" font-size="12" font-weight="600" fill="#1F2328">Обслуживание</text><text x="34" y="380" font-size="11" fill="#5F6672">«Вывести из выдачи»: новые — в соседний пул, выданные работают</text></svg>