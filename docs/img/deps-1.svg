<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" style="max-width:1000px;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема зависимостей"><defs><marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="10" y="20" width="178" height="58" rx="3" fill="#F2F6FC" stroke="#1F4E99"/><text x="20" y="42" font-size="13" font-weight="600" fill="#1F2328">Образ</text><text x="20" y="61" font-size="11.5" fill="#5F6672">ВМ, диск или образ облака</text><rect x="212" y="20" width="178" height="58" rx="3" fill="#fff" stroke="#C5CAD2"/><text x="222" y="42" font-size="13" font-weight="600" fill="#1F2328">Тома-шаблоны</text><text x="222" y="61" font-size="11.5" fill="#5F6672">по одному на тип диска</text><rect x="414" y="20" width="178" height="58" rx="3" fill="#F2F6FC" stroke="#1F4E99"/><text x="424" y="42" font-size="13" font-weight="600" fill="#1F2328">Пул столов</text><text x="424" y="61" font-size="11.5" fill="#5F6672">конфигурация, доступ</text><rect x="616" y="20" width="178" height="58" rx="3" fill="#fff" stroke="#C5CAD2"/><text x="626" y="42" font-size="13" font-weight="600" fill="#1F2328">Версия публикации</text><text x="626" y="61" font-size="11.5" fill="#5F6672">снимок тома-шаблона</text><rect x="818" y="20" width="172" height="58" rx="3" fill="#fff" stroke="#C5CAD2"/><text x="828" y="42" font-size="13" font-weight="600" fill="#1F2328">Столы</text><text x="828" y="61" font-size="11.5" fill="#5F6672">ВМ + диск-клон снимка</text><path d="M190 49 H209" fill="none" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#da)"/><path d="M392 49 H411" fill="none" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#da)"/><path d="M594 49 H613" fill="none" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#da)"/><path d="M796 49 H815" fill="none" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#da)"/><rect x="414" y="160" width="178" height="58" rx="3" fill="#fff" stroke="#C5CAD2"/><text x="424" y="182" font-size="13" font-weight="600" fill="#1F2328">Группы и сотрудники</text><text x="424" y="201" font-size="11.5" fill="#5F6672">AD или собственные</text><path d="M503 158 V81" fill="none" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#da)"/><text x="530" y="125" font-size="11" fill="#5F6672" text-anchor="middle">доступ</text><rect x="616" y="160" width="178" height="58" rx="3" fill="#fff" stroke="#C5CAD2"/><text x="626" y="182" font-size="13" font-weight="600" fill="#1F2328">Программы и настройки</text><text x="626" y="201" font-size="11.5" fill="#5F6672">пакеты, файлы, сертификаты</text><path d="M660 158 C660 120 560 110 540 81" fill="none" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#da)"/><text x="612" y="118" font-size="11" fill="#5F6672" text-anchor="middle">назначение пулу</text><rect x="818" y="160" width="172" height="58" rx="3" fill="#fff" stroke="#C5CAD2"/><text x="828" y="182" font-size="13" font-weight="600" fill="#1F2328">Агент на столе</text><text x="828" y="201" font-size="11.5" fill="#5F6672">забирает задания</text><path d="M796 189 H815" fill="none" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#da)"/><path d="M904 158 V81" fill="none" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#da)"/><text x="944" y="125" font-size="11" fill="#5F6672" text-anchor="middle">применяет</text><rect x="10" y="252" width="980" height="74" rx="3" fill="#FBF3EE" stroke="#E3C2BC"/><text x="24" y="276" font-size="13" font-weight="600" fill="#7A2E12">Удаление — в обратном порядке, справа налево.</text><text x="24" y="296" font-size="12" fill="#5F4436">Образ нельзя удалить, пока его используют пулы. Удалённый пул удаляет свои столы, их диски и снимки публикаций.</text><text x="24" y="314" font-size="12" fill="#5F4436">Группы, сотрудники и программы при удалении пула не удаляются; назначения программ на этот пул снимаются.</text></svg>