<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 336" width="442" height="336" style="max-width:100%;height:auto;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 6 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="1" y="1" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="15" r="8" fill="#1F4E99"/><text x="18" y="18.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="34" y="19" font-size="12" font-weight="600" fill="#1F2328">Пулы столов</text><text x="34" y="34" font-size="11" fill="#5F6672">откройте пул, проверьте, у кого есть столы</text><path d="M18 46 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="59" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#D9A38A"/><circle cx="18" cy="73" r="8" fill="#A3470E"/><text x="18" y="76.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="34" y="77" font-size="12" font-weight="600" fill="#1F2328">Удалить пул</text><text x="34" y="92" font-size="11" fill="#5F6672">кнопка в карточке пула, рядом с «К списку пулов»</text><path d="M18 104 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="117" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#D9A38A"/><circle cx="18" cy="131" r="8" fill="#A3470E"/><text x="18" y="134.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="34" y="135" font-size="12" font-weight="600" fill="#1F2328">Введите YES</text><text x="34" y="150" font-size="11" fill="#5F6672">подтверждение нельзя сделать случайным кликом</text><path d="M18 162 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="175" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="189" r="8" fill="#1F4E99"/><text x="18" y="192.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="34" y="193" font-size="12" font-weight="600" fill="#1F2328">UDS удаляет столы</text><text x="34" y="208" font-size="11" fill="#5F6672">ВМ, диски и снимки публикаций — несколько минут</text><path d="M18 220 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="233" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="247" r="8" fill="#1F4E99"/><text x="18" y="250.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="34" y="251" font-size="12" font-weight="600" fill="#1F2328">Панель прибирает</text><text x="34" y="266" font-size="11" fill="#5F6672">сервис пула, персональную группу, назначения программ</text><path d="M18 278 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="291" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="305" r="8" fill="#1F4E99"/><text x="18" y="308.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">6</text><text x="34" y="309" font-size="12" font-weight="600" fill="#1F2328">Журнал</text><text x="34" y="324" font-size="11" fill="#5F6672">строка «пул удалён» — удаление завершено</text></svg>