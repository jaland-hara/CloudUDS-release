<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 294" width="100%" style="max-width:604px;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 4 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="2" y="2" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="20" r="10" fill="#1F4E99"/><text x="26" y="24" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="46" y="25" font-size="13.5" font-weight="600" fill="#1F2328">Образы</text><text x="46" y="44" font-size="12" fill="#5F6672">на карточке образа видно, какие пулы его используют</text><path d="M26 60 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="80" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#D9A38A"/><circle cx="26" cy="98" r="10" fill="#A3470E"/><text x="26" y="102" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="46" y="103" font-size="13.5" font-weight="600" fill="#1F2328">Удалите эти пулы</text><text x="46" y="122" font-size="12" fill="#5F6672">или создайте их заново из другого образа, затем удалите старые</text><path d="M26 138 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="158" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="176" r="10" fill="#1F4E99"/><text x="26" y="180" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="46" y="181" font-size="13.5" font-weight="600" fill="#1F2328">Дождитесь «пул удалён»</text><text x="46" y="200" font-size="12" fill="#5F6672">в журнале: пока есть снимки публикаций, том-шаблон занят</text><path d="M26 216 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="236" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="254" r="10" fill="#1F4E99"/><text x="26" y="258" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="46" y="259" font-size="13.5" font-weight="600" fill="#1F2328">Образы → Удалить</text><text x="46" y="278" font-size="12" fill="#5F6672">тома-шаблоны образа удаляются из облака</text></svg>