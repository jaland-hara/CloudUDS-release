<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 220" width="442" height="220" style="max-width:100%;height:auto;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 4 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="1" y="1" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="15" r="8" fill="#1F4E99"/><text x="18" y="18.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="34" y="19" font-size="12" font-weight="600" fill="#1F2328">Образы</text><text x="34" y="34" font-size="11" fill="#5F6672">на карточке образа видно, какие пулы его используют</text><path d="M18 46 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="59" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#D9A38A"/><circle cx="18" cy="73" r="8" fill="#A3470E"/><text x="18" y="76.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="34" y="77" font-size="12" font-weight="600" fill="#1F2328">Удалите эти пулы</text><text x="34" y="92" font-size="11" fill="#5F6672">или создайте их заново из другого образа, затем удалите старые</text><path d="M18 104 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="117" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="131" r="8" fill="#1F4E99"/><text x="18" y="134.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="34" y="135" font-size="12" font-weight="600" fill="#1F2328">Дождитесь «пул удалён»</text><text x="34" y="150" font-size="11" fill="#5F6672">в журнале: пока есть снимки публикаций, том-шаблон занят</text><path d="M18 162 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="175" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="189" r="8" fill="#1F4E99"/><text x="18" y="192.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="34" y="193" font-size="12" font-weight="600" fill="#1F2328">Образы → Удалить</text><text x="34" y="208" font-size="11" fill="#5F6672">тома-шаблоны образа удаляются из облака</text></svg>