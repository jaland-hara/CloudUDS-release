<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 304" width="442" height="304" style="max-width:100%;height:auto;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 4 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="1" y="1" width="440" height="72" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="15" r="8" fill="#1F4E99"/><text x="18" y="18.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="34" y="19" font-size="12" font-weight="600" fill="#1F2328">Мастер установки</text><text x="34" y="34" font-size="11" fill="#5F6672">при установке и обновлении (шаг «Секреты установки → внешние</text><text x="34" y="48" font-size="11" fill="#5F6672">хранилища»): ключи UDS, пароли баз и ролей, корень</text><text x="34" y="62" font-size="11" fill="#5F6672">сертификатов, SSH-ключ к узлам, состав установки — installer.*</text><path d="M18 74 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="87" width="440" height="72" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="101" r="8" fill="#1F4E99"/><text x="18" y="104.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="34" y="105" font-size="12" font-weight="600" fill="#1F2328">Кабинет</text><text x="34" y="120" font-size="11" fill="#5F6672">ведущий узел каждые 6 часов и по кнопке: мастер-ключ,</text><text x="34" y="134" font-size="11" fill="#5F6672">служебные пароли, CA узлов, ACME, сертификаты сайта с ключами</text><text x="34" y="148" font-size="11" fill="#5F6672">— panel.*, certs.*</text><path d="M18 160 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="173" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="187" r="8" fill="#1F4E99"/><text x="18" y="190.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="34" y="191" font-size="12" font-weight="600" fill="#1F2328">Сверка</text><text x="34" y="206" font-size="11" fill="#5F6672">каждый час по контрольным суммам; отставание или недоступность</text><text x="34" y="220" font-size="11" fill="#5F6672">— «Состояние системы» и канал «Безопасность»</text><path d="M18 232 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="245" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="259" r="8" fill="#1F4E99"/><text x="18" y="262.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="34" y="263" font-size="12" font-weight="600" fill="#1F2328">Проверка восстановления</text><text x="34" y="278" font-size="11" fill="#5F6672">по кнопке: каждое значение читается обратно, расшифровывается</text><text x="34" y="292" font-size="11" fill="#5F6672">и сравнивается с установкой</text></svg>