<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="900" height="270" style="max-width:100%;height:auto" role="img" aria-label="Схема: слои защиты входа от фронтов до домена"><defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F6672"/></marker><marker id="pw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A3470E"/></marker></defs><rect width="1000" height="300" fill="#FFFFFF"/><rect x="10" y="110" width="120" height="80" rx="5" fill="#F3F4F6" stroke="#DCDFE4" stroke-width="1.5"/><text x="70" y="142" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328" text-anchor="middle">Браузер,</text><text x="70" y="160" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328" text-anchor="middle">клиент, бот</text><text x="70" y="178" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6672" text-anchor="middle">интернет / офис</text><path d="M132 150L158 150" stroke="#5F6672" stroke-width="1.5" fill="none" marker-end="url(#pa)"/><rect x="160" y="40" width="270" height="230" rx="5" fill="#EAF0FA" stroke="#1F4E99" stroke-width="2"/><text x="295" y="66" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328" text-anchor="middle">Фронты (HAProxy)</text><text x="295" y="84" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6672" text-anchor="middle">считают по адресу клиента</text><rect x="175" y="100" width="240" height="46" rx="5" fill="#FFFFFF" stroke="#DCDFE4" stroke-width="1.5"/><text x="187" y="119" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">1. Белые списки адресов,</text><text x="187" y="136" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6672">кабинет закрыт из интернета → 403</text><rect x="175" y="154" width="240" height="46" rx="5" fill="#FFFFFF" stroke="#DCDFE4" stroke-width="1.5"/><text x="187" y="173" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">2. Лимит попыток в минуту</text><text x="187" y="190" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6672">выше → 429 до паузы в попытках</text><rect x="175" y="208" width="240" height="50" rx="5" fill="#FDF3EA" stroke="#A3470E" stroke-width="1.5"/><text x="187" y="227" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">3. Капча после N попыток</text><text x="187" y="245" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6672">без пропуска vdicap → 403</text><path d="M432 150L458 150" stroke="#5F6672" stroke-width="1.5" fill="none" marker-end="url(#pa)"/><rect x="460" y="40" width="160" height="230" rx="5" fill="#FFFFFF" stroke="#DCDFE4" stroke-width="1.5"/><text x="540" y="66" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328" text-anchor="middle">Портал, кабинет</text><text x="540" y="84" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6672" text-anchor="middle">по человеку</text><text x="474" y="116" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">Второй фактор:</text><text x="474" y="136" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">код, ключ доступа,</text><text x="474" y="156" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">почта, SMS, RADIUS</text><text x="474" y="176" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">«С прошлого входа</text><text x="474" y="196" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">пароль вводили</text><text x="474" y="216" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">неверно: N»</text><path d="M622 150L648 150" stroke="#5F6672" stroke-width="1.5" fill="none" marker-end="url(#pa)"/><rect x="650" y="40" width="160" height="230" rx="5" fill="#FFFFFF" stroke="#DCDFE4" stroke-width="1.5"/><text x="730" y="66" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328" text-anchor="middle">UDS</text><text x="730" y="84" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6672" text-anchor="middle">по учётной записи</text><text x="664" y="116" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">N неверных паролей</text><text x="664" y="136" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">→ учётка не входит</text><text x="664" y="156" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">в UDS заданное</text><text x="664" y="176" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">время; порог ниже,</text><text x="664" y="196" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">чем в домене</text><path d="M812 150L838 150" stroke="#5F6672" stroke-width="1.5" fill="none" marker-end="url(#pa)"/><rect x="840" y="40" width="150" height="230" rx="5" fill="#FFFFFF" stroke="#DCDFE4" stroke-width="1.5"/><text x="915" y="66" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2328" text-anchor="middle">Active Directory</text><text x="915" y="84" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6672" text-anchor="middle">по учётке в домене</text><text x="854" y="116" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">Политика блокировки</text><text x="854" y="136" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">домена: последний</text><text x="854" y="156" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">рубеж; до неё</text><text x="854" y="176" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">перебор доходить</text><text x="854" y="196" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328">не должен</text><text x="500" y="292" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6672" text-anchor="middle">Запрос проходит слои слева направо: первый отказ останавливает его, до UDS и домена доходит только то, что пропустили фронты</text></svg>