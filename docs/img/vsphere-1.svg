<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 508" width="442" height="508" style="max-width:100%;height:auto;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 8 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="1" y="1" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="15" r="8" fill="#1F4E99"/><text x="18" y="18.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="34" y="19" font-size="12" font-weight="600" fill="#1F2328">Эталонная ВМ</text><text x="34" y="34" font-size="11" fill="#5F6672">Windows или Linux с агентом UDS 5 в папке CloudUDS в vCenter</text><path d="M18 46 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="59" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="73" r="8" fill="#1F4E99"/><text x="18" y="76.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="34" y="77" font-size="12" font-weight="600" fill="#1F2328">Образ каталога</text><text x="34" y="92" font-size="11" fill="#5F6672">«Образы» → «Добавить образ» → VMware vSphere: ВМ закрепляется</text><text x="34" y="106" font-size="11" fill="#5F6672">по ID (moid + UUID)</text><path d="M18 118 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="131" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="145" r="8" fill="#1F4E99"/><text x="18" y="148.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="34" y="149" font-size="12" font-weight="600" fill="#1F2328">Мастер пула</text><text x="34" y="164" font-size="11" fill="#5F6672">платформа VMware vSphere, тип клонов, vGPU, размер, хранилище,</text><text x="34" y="178" font-size="11" fill="#5F6672">порт-группа</text><path d="M18 190 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="203" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="217" r="8" fill="#1F4E99"/><text x="18" y="220.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="34" y="221" font-size="12" font-weight="600" fill="#1F2328">Версия пула</text><text x="34" y="236" font-size="11" fill="#5F6672">полная копия эталона + снимок uds-base (~1 мин); у мгновенных</text><text x="34" y="250" font-size="11" fill="#5F6672">— ещё запуск и «заморозка»</text><path d="M18 262 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="275" width="440" height="58" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="289" r="8" fill="#1F4E99"/><text x="18" y="292.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="34" y="293" font-size="12" font-weight="600" fill="#1F2328">Стол</text><text x="34" y="308" font-size="11" fill="#5F6672">связанный, полный или мгновенный клон: MAC из диапазона UDS,</text><text x="34" y="322" font-size="11" fill="#5F6672">адрес от DHCP</text><path d="M18 334 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="347" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="361" r="8" fill="#1F4E99"/><text x="18" y="364.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">6</text><text x="34" y="365" font-size="12" font-weight="600" fill="#1F2328">Агент UDS</text><text x="34" y="380" font-size="11" fill="#5F6672">переименует стол, введёт в домен, сообщит о готовности</text><path d="M18 392 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="405" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="419" r="8" fill="#1F4E99"/><text x="18" y="422.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">7</text><text x="34" y="423" font-size="12" font-weight="600" fill="#1F2328">Портал</text><text x="34" y="438" font-size="11" fill="#5F6672">сотрудник подключается как обычно: приложение или браузер</text><path d="M18 450 v10" stroke="#8C94A1" stroke-width="1.2" marker-end="url(#ha)"/><rect x="1" y="463" width="440" height="44" rx="4" fill="#FFFFFF" stroke="#D9A38A"/><circle cx="18" cy="477" r="8" fill="#A3470E"/><text x="18" y="480.5" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">8</text><text x="34" y="481" font-size="12" font-weight="600" fill="#1F2328">Обновить образ</text><text x="34" y="496" font-size="11" fill="#5F6672">обновите эталон и выпустите новую версию пула</text></svg>