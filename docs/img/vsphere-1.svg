<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 604 638" width="100%" style="max-width:604px;font-family:IBM Plex Sans,sans-serif" role="img" aria-label="Схема: 8 шагов, они перечислены ниже"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="2" y="2" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="20" r="10" fill="#1F4E99"/><text x="26" y="24" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="46" y="25" font-size="13.5" font-weight="600" fill="#1F2328">Эталонная ВМ</text><text x="46" y="44" font-size="12" fill="#5F6672">Windows или Linux с агентом UDS 5 в папке CloudUDS в vCenter</text><path d="M26 60 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="80" width="600" height="72" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="98" r="10" fill="#1F4E99"/><text x="26" y="102" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="46" y="103" font-size="13.5" font-weight="600" fill="#1F2328">Образ каталога</text><text x="46" y="122" font-size="12" fill="#5F6672">«Образы» → «Добавить образ» → VMware vSphere: ВМ закрепляется по ID (moid</text><text x="46" y="138" font-size="12" fill="#5F6672">+ UUID)</text><path d="M26 154 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="174" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="192" r="10" fill="#1F4E99"/><text x="26" y="196" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="46" y="197" font-size="13.5" font-weight="600" fill="#1F2328">Мастер пула</text><text x="46" y="216" font-size="12" fill="#5F6672">платформа VMware vSphere, тип клонов, vGPU, размер, хранилище, порт-группа</text><path d="M26 232 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="252" width="600" height="72" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="270" r="10" fill="#1F4E99"/><text x="26" y="274" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="46" y="275" font-size="13.5" font-weight="600" fill="#1F2328">Версия пула</text><text x="46" y="294" font-size="12" fill="#5F6672">полная копия эталона + снимок uds-base (~1 мин); у мгновенных — ещё запуск</text><text x="46" y="310" font-size="12" fill="#5F6672">и «заморозка»</text><path d="M26 326 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="346" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="364" r="10" fill="#1F4E99"/><text x="26" y="368" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="46" y="369" font-size="13.5" font-weight="600" fill="#1F2328">Стол</text><text x="46" y="388" font-size="12" fill="#5F6672">связанный, полный или мгновенный клон: MAC из диапазона UDS, адрес от DHCP</text><path d="M26 404 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="424" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="442" r="10" fill="#1F4E99"/><text x="26" y="446" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">6</text><text x="46" y="447" font-size="13.5" font-weight="600" fill="#1F2328">Агент UDS</text><text x="46" y="466" font-size="12" fill="#5F6672">переименует стол, введёт в домен, сообщит о готовности</text><path d="M26 482 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="502" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="26" cy="520" r="10" fill="#1F4E99"/><text x="26" y="524" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">7</text><text x="46" y="525" font-size="13.5" font-weight="600" fill="#1F2328">Портал</text><text x="46" y="544" font-size="12" fill="#5F6672">сотрудник подключается как обычно: приложение или браузер</text><path d="M26 560 v16" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="580" width="600" height="56" rx="4" fill="#FFFFFF" stroke="#D9A38A"/><circle cx="26" cy="598" r="10" fill="#A3470E"/><text x="26" y="602" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">8</text><text x="46" y="603" font-size="13.5" font-weight="600" fill="#1F2328">Обновить образ</text><text x="46" y="622" font-size="12" fill="#5F6672">обновите эталон и выпустите новую версию пула</text></svg>