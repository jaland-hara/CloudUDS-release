<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 190" width="100%" style="max-width:890px;font-family:IBM Plex Sans,sans-serif" role="img"><defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C94A1"/></marker></defs><rect x="2" y="2" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="18" r="10" fill="#1F4E99"/><text x="18" y="22" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="34" y="23" font-size="12.5" font-weight="600" fill="#1F2328">Эталонная ВМ</text><text x="12" y="44" font-size="11.5" fill="#5F6672">Windows или Linux с агентом</text><text x="12" y="58" font-size="11.5" fill="#5F6672">UDS 5 в папке CloudUDS в</text><text x="12" y="72" font-size="11.5" fill="#5F6672">vCenter</text><path d="M202 41 h24" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="232" y="2" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="248" cy="18" r="10" fill="#1F4E99"/><text x="248" y="22" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="264" y="23" font-size="12.5" font-weight="600" fill="#1F2328">Образ каталога</text><text x="242" y="44" font-size="11.5" fill="#5F6672">«Образы» → «Добавить образ» →</text><text x="242" y="58" font-size="11.5" fill="#5F6672">VMware vSphere: ВМ</text><text x="242" y="72" font-size="11.5" fill="#5F6672">закрепляется по ID (moid +</text><path d="M432 41 h24" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="462" y="2" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="478" cy="18" r="10" fill="#1F4E99"/><text x="478" y="22" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="494" y="23" font-size="12.5" font-weight="600" fill="#1F2328">Мастер пула</text><text x="472" y="44" font-size="11.5" fill="#5F6672">платформа VMware vSphere, тип</text><text x="472" y="58" font-size="11.5" fill="#5F6672">клонов, vGPU, размер,</text><text x="472" y="72" font-size="11.5" fill="#5F6672">хранилище, порт-группа</text><path d="M662 41 h24" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="692" y="2" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="708" cy="18" r="10" fill="#1F4E99"/><text x="708" y="22" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="724" y="23" font-size="12.5" font-weight="600" fill="#1F2328">Версия пула</text><text x="702" y="44" font-size="11.5" fill="#5F6672">полная копия эталона + снимок</text><text x="702" y="58" font-size="11.5" fill="#5F6672">uds-base (~1 мин); у</text><text x="702" y="72" font-size="11.5" fill="#5F6672">мгновенных — ещё запуск и</text><path d="M790 83 v10 H100 v12" fill="none" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="2" y="110" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="18" cy="126" r="10" fill="#1F4E99"/><text x="18" y="130" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="34" y="131" font-size="12.5" font-weight="600" fill="#1F2328">Стол</text><text x="12" y="152" font-size="11.5" fill="#5F6672">связанный, полный или</text><text x="12" y="166" font-size="11.5" fill="#5F6672">мгновенный клон: MAC из</text><text x="12" y="180" font-size="11.5" fill="#5F6672">диапазона UDS, адрес от DHCP</text><path d="M202 149 h24" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="232" y="110" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="248" cy="126" r="10" fill="#1F4E99"/><text x="248" y="130" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">6</text><text x="264" y="131" font-size="12.5" font-weight="600" fill="#1F2328">Агент UDS</text><text x="242" y="152" font-size="11.5" fill="#5F6672">переименует стол, введёт в</text><text x="242" y="166" font-size="11.5" fill="#5F6672">домен, сообщит о готовности</text><path d="M432 149 h24" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="462" y="110" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#C5CAD2"/><circle cx="478" cy="126" r="10" fill="#1F4E99"/><text x="478" y="130" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">7</text><text x="494" y="131" font-size="12.5" font-weight="600" fill="#1F2328">Портал</text><text x="472" y="152" font-size="11.5" fill="#5F6672">сотрудник подключается как</text><text x="472" y="166" font-size="11.5" fill="#5F6672">обычно: приложение или браузер</text><path d="M662 149 h24" stroke="#8C94A1" stroke-width="1.5" marker-end="url(#ha)"/><rect x="692" y="110" width="196" height="78" rx="3" fill="#FFFFFF" stroke="#D9A38A"/><circle cx="708" cy="126" r="10" fill="#A3470E"/><text x="708" y="130" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">8</text><text x="724" y="131" font-size="12.5" font-weight="600" fill="#1F2328">Обновить образ</text><text x="702" y="152" font-size="11.5" fill="#5F6672">обновите эталон и выпустите</text><text x="702" y="166" font-size="11.5" fill="#5F6672">новую версию пула</text></svg>