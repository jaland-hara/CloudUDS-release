<svg xmlns="http://www.w3.org/2000/svg" class="flow" viewBox="0 0 1000 330" width="760" height="251" style="max-width:100%;height:auto" role="img" aria-label="Схема: образ, эталонная ВМ, том-шаблон, снимок публикации, диски столов, ВМ столов"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor" style="color:#5F6672"/></marker></defs><g><rect class="box" x="20" y="20" width="290" height="118" rx="4"/><text class="t" x="36" y="48">1. Образ ОС</text><text class="s" x="36" y="70">ISO, live-DVD или облачный образ.</text><text class="s" x="36" y="87">Нужен один раз — чтобы</text><text class="s" x="36" y="104">создать эталон.</text><text class="m" x="36" y="124">Glance / ISO</text></g><g><rect class="box" x="355" y="20" width="290" height="118" rx="4"/><text class="t" x="371" y="48">2. Эталонная ВМ (gold image)</text><text class="s" x="371" y="70">Ставим ОС, xrdp, агент UDS,</text><text class="s" x="371" y="87">наши настройки; затем</text><text class="s" x="371" y="104">выключаем.</text><text class="m" x="371" y="124">ВМ из тома-шаблона</text></g><g><rect class="box hi" x="690" y="20" width="290" height="118" rx="4"/><text class="t" x="706" y="48">3. Том-шаблон</text><text class="s" x="706" y="70">Диск эталона. Задаёт тип диска</text><text class="s" x="706" y="87">(SSD/HDD) и зону доступности</text><text class="s" x="706" y="104">всех машин каталога.</text><text class="m" x="706" y="124">vdi-tpl-…</text></g><g><rect class="box hi" x="690" y="200" width="290" height="118" rx="4"/><text class="t" x="706" y="228">4. Публикация = снимок тома</text><text class="s" x="706" y="250">«Обновить образ» делает снимок</text><text class="s" x="706" y="267">шаблона. Живёт, пока на нём</text><text class="s" x="706" y="284">есть машины.</text><text class="m" x="706" y="304">UDS-Pub-&lt;каталог&gt;-v&lt;N&gt;</text></g><rect class="box" x="367" y="188" width="290" height="118" rx="4"/><rect class="box" x="361" y="194" width="290" height="118" rx="4"/><g><rect class="box" x="355" y="200" width="290" height="118" rx="4"/><text class="t" x="371" y="228">5. Диск машины = клон снимка</text><text class="s" x="371" y="250">Для ОС — полный диск (40 ГБ),</text><text class="s" x="371" y="267">в хранилище — только изменения;</text><text class="s" x="371" y="284">создаётся за секунды.</text><text class="m" x="371" y="304">UDS_T01-P04-00</text></g><g><rect class="box" x="20" y="200" width="290" height="118" rx="4"/><text class="t" x="36" y="228">6. ВМ стола</text><text class="s" x="36" y="250">Конфигурация каталога, сеть.</text><text class="s" x="36" y="267">Агент задаёт имя, домен или</text><text class="s" x="36" y="284">пароль и сообщает «готов».</text><text class="m" x="36" y="304">UDS_T01-P04-00</text></g><path class="ar" d="M310 79H351"/><path class="ar" d="M645 79H686"/><path class="ar" d="M835 138V196"/><path class="ar" d="M690 259H663"/><path class="ar" d="M355 259H314"/><text class="lbl" x="848" y="172">публикация</text><text class="lbl" x="648" y="250">клон</text><text class="lbl" x="318" y="250">загрузка</text></svg>