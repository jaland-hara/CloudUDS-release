<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 880" width="1640" height="880"><style>
.h1{font:700 30px Arial,Helvetica,sans-serif;fill:#1C2430}.h2{font:16px Arial,Helvetica,sans-serif;fill:#4A5565}
.zt{font:700 19px Arial,Helvetica,sans-serif}.bt{font:700 16px Arial,Helvetica,sans-serif}.bs{font:14px Arial,Helvetica,sans-serif}
.vn{font:700 15px Arial,Helvetica,sans-serif;fill:#1C2430}.vr{font:13px Arial,Helvetica,sans-serif;fill:#4A5565}
.vp{font:12.5px Arial,Helvetica,sans-serif;fill:#8A1C1C}.ip{font:700 13px Consolas,Menlo,monospace}
.al{font:13px Arial,Helvetica,sans-serif;fill:#3A4556}.note{font:italic 14px Arial,Helvetica,sans-serif;fill:#6B7684}
.th{font:700 14px Arial,Helvetica,sans-serif;fill:#1C2430}.td{font:14px Arial,Helvetica,sans-serif;fill:#1C2430}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><rect width="1640" height="880" fill="#FFFFFF"/><text x="40" y="50" class="h1">Базовая установка — по одной ВМ на роль</text><text x="40" y="74" class="h2">Нагрузка разнесена по ролям, туннель не грузит брокер; без отказоустойчивости: при отказе узла его роль недоступна до восстановления. Переход на стандартную — добавлением узлов.</text><rect x="20" y="100" width="200" height="520" rx="16" fill="#FDF1E3" stroke="#C46A00" stroke-width="2" stroke-dasharray="8 6"/><text x="36" y="130" class="zt" fill="#C46A00">Сотрудники</text><circle cx="120" cy="175" r="11" fill="#6B7684"/><line x1="120" y1="186" x2="120" y2="217" stroke="#6B7684" stroke-width="3"/><line x1="102" y1="197" x2="138" y2="197" stroke="#6B7684" stroke-width="3"/><line x1="120" y1="217" x2="105" y2="239" stroke="#6B7684" stroke-width="3"/><line x1="120" y1="217" x2="135" y2="239" stroke="#6B7684" stroke-width="3"/><text x="120" y="259" class="vn" text-anchor="middle">контур / VPN</text><path d="M32,440 h162 l14,14 v124 h-176 z" fill="#FFFBE6" stroke="#C9B458"/><text x="42" y="462" class="td">vdi.компания.local</text><text x="42" y="480" class="td">→ адрес фронта</text><text x="42" y="498" class="td">туннель — по адресу</text><text x="42" y="516" class="td">узла туннеля</text><text x="42" y="534" class="td"></text><text x="42" y="552" class="td">по желанию: вход из</text><text x="42" y="570" class="td">интернета (1+1 в DMZ)</text><rect x="250" y="100" width="250" height="520" rx="16" fill="#FDECEA" stroke="#B42318" stroke-width="2" stroke-dasharray="8 6"/><text x="266" y="130" class="zt" fill="#B42318">Вход</text><rect x="275" y="150" width="200" height="120" rx="8" fill="#FFF7E6" stroke="#C46A00" stroke-width="2"/><text x="285" y="172" class="vn" text-anchor="start">Фронт</text><text x="285" y="191" class="vr" text-anchor="start">HAProxy</text><text x="285" y="209" class="vr" text-anchor="start">TLS, правила, балансировка</text><text x="285" y="226" class="vr" text-anchor="start">сертификаты — из кабинета</text><rect x="275" y="380" width="200" height="120" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="285" y="402" class="vn" text-anchor="start">Туннель UDS</text><text x="285" y="421" class="vr" text-anchor="start">1 узел</text><text x="285" y="439" class="vr" text-anchor="start">клиент UDS → RDP</text><text x="285" y="456" class="vr" text-anchor="start">~200 сеансов</text><rect x="530" y="100" width="300" height="520" rx="16" fill="#EAF0FD" stroke="#2458D6" stroke-width="2" stroke-dasharray="8 6"/><text x="546" y="130" class="zt" fill="#2458D6">Приложения и данные</text><rect x="555" y="150" width="250" height="120" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="565" y="172" class="vn" text-anchor="start">Брокер + кабинет</text><text x="565" y="191" class="vr" text-anchor="start">Docker</text><text x="565" y="209" class="vr" text-anchor="start">веб и REST UDS, задачи</text><text x="565" y="226" class="vr" text-anchor="start">кабинет и портал</text><rect x="555" y="300" width="250" height="90" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="565" y="322" class="vn" text-anchor="start">Шлюз HTML5</text><text x="565" y="341" class="vr" text-anchor="start">Guacamole, ~50 сеансов</text><path d="M590,440 v130 a90.0,10 0 0 0 180,0 v-130 a90.0,10 0 0 0 -180,0 a90.0,10 0 0 0 180,0" fill="#FFFFFF" stroke="#2458D6" stroke-width="2"/><text x="600" y="464" class="vn" text-anchor="start">MariaDB Galera</text><text x="600" y="483" class="vr" text-anchor="start">база UDS и кабинета</text><text x="600" y="501" class="vr" text-anchor="start">1 узел</text><text x="600" y="518" class="vr" text-anchor="start">растёт до 3 — без</text><text x="600" y="535" class="vr" text-anchor="start">переноса данных</text><rect x="860" y="100" width="240" height="520" rx="16" fill="#E9F6EE" stroke="#1B7F3B" stroke-width="2" stroke-dasharray="8 6"/><text x="876" y="130" class="zt" fill="#1B7F3B">Сеть столов</text><rect x="894" y="141" width="190" height="250" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><rect x="885" y="150" width="190" height="250" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="895" y="172" class="vn" text-anchor="start">Рабочие столы</text><text x="895" y="191" class="vr" text-anchor="start">пулы по группам</text><text x="895" y="209" class="vr" text-anchor="start">агент UDS</text><text x="895" y="226" class="vr" text-anchor="start">агент «Программы</text><text x="895" y="243" class="vr" text-anchor="start">и настройки»</text><text x="895" y="260" class="vr" text-anchor="start"></text><text x="895" y="277" class="vr" text-anchor="start">RDP — только с туннеля</text><text x="895" y="294" class="vr" text-anchor="start">и шлюза</text><rect x="1041" y="130" width="42" height="22" rx="11" fill="#3A4556"/><text x="1062" y="146" class="bs" fill="#FFFFFF" text-anchor="middle" font-weight="700">×N</text><rect x="1130" y="100" width="490" height="520" rx="16" fill="#E6F4F2" stroke="#0F766E" stroke-width="2" stroke-dasharray="8 6"/><text x="1146" y="130" class="zt" fill="#0F766E">Инфраструктура</text><rect x="1164" y="141" width="210" height="110" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><rect x="1155" y="150" width="210" height="110" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="1165" y="172" class="vn" text-anchor="start">Контроллеры домена</text><text x="1165" y="191" class="vr" text-anchor="start">AD, DNS, CA организации</text><rect x="1331" y="130" width="42" height="22" rx="11" fill="#3A4556"/><text x="1352" y="146" class="bs" fill="#FFFFFF" text-anchor="middle" font-weight="700">×2</text><rect x="1385" y="150" width="210" height="110" rx="8" fill="#F1F3F6" stroke="#6B7684" stroke-width="2"/><text x="1395" y="172" class="vn" text-anchor="start">Платформы</text><text x="1395" y="191" class="vr" text-anchor="start">API VK Cloud</text><text x="1395" y="209" class="vr" text-anchor="start">опция: vCenter (vSphere)</text><rect x="1155" y="320" width="210" height="90" rx="8" fill="#F1F3F6" stroke="#6B7684" stroke-width="2"/><text x="1165" y="342" class="vn" text-anchor="start">S3, почта, SIEM</text><text x="1165" y="361" class="vr" text-anchor="start">профили, уведомления</text><path d="M140,172.0 L275,172.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="190.4" y="161.0" width="34.2" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="207.5" y="177.0" class="al" text-anchor="middle">443</text><path d="M120,260 L120,440 L275,440" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="139.7" y="429.0" width="115.60000000000001" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="197.5" y="445.0" class="al" text-anchor="middle">клиент UDS 443</text><path d="M475,186.0 L555,186.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="468.3" y="175.0" width="93.4" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="515.0" y="191.0" class="al" text-anchor="middle">8000 · 8100</text><path d="M475,240.0 L515,240.0 L515,345.0 L555,345.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="494.2" y="281.5" width="41.6" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="515.0" y="297.5" class="al" text-anchor="middle">8080</text><path d="M555,255 L542,255 L542,412 L680,412 L680,430" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="590.2" y="401.0" width="41.6" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="611.0" y="417.0" class="al" text-anchor="middle">3306</text><path d="M805,186.0 L885,186.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="820.5" y="175.0" width="49.0" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="845.0" y="191.0" class="al" text-anchor="middle">43910</text><path d="M805,345.0 L885,345.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="809.4" y="334.0" width="71.2" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="845.0" y="350.0" class="al" text-anchor="middle">RDP 3389</text><path d="M375.0,500 L375,600 L980,600 L980,400" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="762.9" y="589.0" width="71.2" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="798.5" y="605.0" class="al" text-anchor="middle">RDP 3389</text><path d="M1075,210 L1155,210.5" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><path d="M680.0,150 L680,92 L1490,92 L1490,150" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="982.8" y="81.0" width="204.4" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1085.0" y="97.0" class="al" text-anchor="middle">LDAPS 636 · API 443 · SMTP</text><rect x="20" y="660" width="1580" height="150" fill="#FFFFFF" stroke="#C9CED6"/><rect x="20" y="660" width="1580" height="30" fill="#EEF1F6"/><text x="30" y="680" class="th">Откуда → куда</text><text x="430" y="680" class="th">Порт</text><text x="670" y="680" class="th">Зачем</text><line x1="20" y1="690" x2="1600" y2="690" stroke="#E3E6EB"/><text x="30" y="710" class="td">сотрудник → фронт / туннель</text><text x="430" y="710" class="td">443 / 443</text><text x="670" y="710" class="td">портал, кабинет, браузер / клиент UDS</text><line x1="20" y1="720" x2="1600" y2="720" stroke="#E3E6EB"/><text x="30" y="740" class="td">фронт → брокер, кабинет, шлюз HTML5</text><text x="430" y="740" class="td">8000, 8100, 8080</text><text x="670" y="740" class="td">маршруты по именам и путям</text><line x1="20" y1="750" x2="1600" y2="750" stroke="#E3E6EB"/><text x="30" y="770" class="td">туннель и шлюз → фронт; → столы</text><text x="430" y="770" class="td">443; 3389</text><text x="670" y="770" class="td">тикеты сеансов, агенты; RDP</text><line x1="20" y1="780" x2="1600" y2="780" stroke="#E3E6EB"/><text x="30" y="800" class="td">брокер → Galera; → столы; → домен, облако</text><text x="430" y="800" class="td">3306; 43910; 636, 443</text><text x="670" y="800" class="td">база; агент UDS; вход сотрудников, создание столов</text></svg>