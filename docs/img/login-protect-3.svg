<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="900" height="522" style="max-width:100%;height:auto" role="img" aria-label="Схема: вход с капчей — браузер, фронт, портал, UDS"><defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F6672"/></marker><marker id="pw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A3470E"/></marker></defs><rect width="1000" height="580" fill="#FFFFFF"/><rect x="75" y="14" width="200" height="46" rx="5" fill="#F3F4F6" stroke="#DCDFE4" stroke-width="1.5"/><text x="175" y="34" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328" text-anchor="middle">Браузер</text><text x="175" y="51" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6672" text-anchor="middle">страница входа</text><rect x="335" y="14" width="200" height="46" rx="5" fill="#F3F4F6" stroke="#DCDFE4" stroke-width="1.5"/><text x="435" y="34" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328" text-anchor="middle">Фронт (HAProxy)</text><text x="435" y="51" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6672" text-anchor="middle">лимит, капча, пропуск</text><rect x="575" y="14" width="200" height="46" rx="5" fill="#F3F4F6" stroke="#DCDFE4" stroke-width="1.5"/><text x="675" y="34" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328" text-anchor="middle">Портал</text><text x="675" y="51" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6672" text-anchor="middle">/my/api/captcha</text><rect x="790" y="14" width="200" height="46" rx="5" fill="#F3F4F6" stroke="#DCDFE4" stroke-width="1.5"/><text x="890" y="34" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328" text-anchor="middle">UDS, кабинет</text><text x="890" y="51" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6672" text-anchor="middle">проверка пароля</text><path d="M175 62V550" stroke="#DCDFE4" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M435 62V550" stroke="#DCDFE4" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M675 62V550" stroke="#DCDFE4" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M890 62V550" stroke="#DCDFE4" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M179 92L431 92" stroke="#5F6672" stroke-width="1.5" fill="none" marker-end="url(#pa)"/><text x="305" y="85" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328" text-anchor="middle">1. POST вход (6-я попытка за 10 мин)</text><text x="305" y="107" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6672" text-anchor="middle">адрес клиента — настоящий: PROXY от пограничных фронтов</text><path d="M431 136L179 136" stroke="#A3470E" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#pw)"/><text x="305" y="129" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#A3470E" text-anchor="middle">2. 403 «Подтвердите, что вы не робот»</text><path d="M179 180L671 180" stroke="#5F6672" stroke-width="1.5" fill="none" marker-end="url(#pa)"/><text x="425" y="173" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328" text-anchor="middle">3. GET /my/api/captcha</text><text x="425" y="195" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6672" text-anchor="middle">страница входа сама открывает капчу</text><path d="M671 224L179 224" stroke="#5F6672" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#pa)"/><text x="425" y="217" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328" text-anchor="middle">4. картинка 5 цифр (штрихи), соль, задание</text><text x="425" y="239" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6672" text-anchor="middle">задание = хэш ответа + соль + срок 5 мин, подписано HMAC</text><rect x="20" y="252" width="310" height="40" rx="5" fill="#FDF3EA" stroke="#A3470E" stroke-width="1.5"/><text x="175" y="268" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328" text-anchor="middle">5. человек вводит цифры</text><text x="175" y="284" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6672" text-anchor="middle">браузер ищет nonce: SHA-256 с 18 нулевыми битами</text><path d="M179 318L671 318" stroke="#5F6672" stroke-width="1.5" fill="none" marker-end="url(#pa)"/><text x="425" y="311" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328" text-anchor="middle">6. POST ответ + nonce + задание</text><path d="M671 362L179 362" stroke="#5F6672" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#pa)"/><text x="425" y="355" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328" text-anchor="middle">7. cookie vdicap = срок.HMAC(ключ, «срок|адрес»)</text><text x="425" y="377" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6672" text-anchor="middle">портал проверил подпись, срок, работу и цифры; пропуск — 15 минут</text><path d="M179 406L431 406" stroke="#5F6672" stroke-width="1.5" fill="none" marker-end="url(#pa)"/><text x="305" y="399" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328" text-anchor="middle">8. POST вход + cookie vdicap</text><rect x="280" y="434" width="310" height="40" rx="5" fill="#FDF3EA" stroke="#A3470E" stroke-width="1.5"/><text x="435" y="450" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2328" text-anchor="middle">9. HAProxy сам проверяет пропуск</text><text x="435" y="466" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6672" text-anchor="middle">HMAC от «срок|адрес этого клиента», срок не истёк</text><path d="M439 500L886 500" stroke="#1B6E4F" stroke-width="1.5" fill="none" marker-end="url(#pa)"/><text x="662.5" y="493" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B6E4F" text-anchor="middle">10. вход пропущен дальше</text><text x="662.5" y="515" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6672" text-anchor="middle">пароль проверяют UDS и домен (их блокировки по учётке)</text></svg>