</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A4556"/></marker></defs><rect width="1640" height="640" fill="#FFFFFF"/><text x="40" y="50" class="h1">Пути сеанса</text><text x="40" y="74" class="h2">Как идёт картинка стола при каждом способе входа. Брокер выдаёт клиенту адрес туннеля по его сети (корпоративные сети — «Размещение»).</text><rect x="20" y="105" width="1600" height="96" rx="10" fill="#F7F9FC" stroke="#E3E6EB"/><text x="36" y="149" class="vn" text-anchor="start">Клиент UDS</text><text x="36" y="169" class="vr" text-anchor="start">из интернета</text><rect x="330.0" y="131" width="165" height="44" rx="8" fill="#F1F3F6" stroke="#6B7684" stroke-width="2"/><text x="412.5" y="158.0" class="vn" text-anchor="middle">клиент UDS</text><rect x="826.0" y="131" width="213" height="44" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="932.5" y="158.0" class="vn" text-anchor="middle">внешний туннель (DMZ)</text><rect x="1370.0" y="131" width="165" height="44" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="1452.5" y="158.0" class="vn" text-anchor="middle">стол</text><path d="M495.0,153.0 L826.0,153.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="565.7" y="142.0" width="189.60000000000002" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="660.5" y="158.0" class="al" text-anchor="middle">443 · tun.поддомен → FIP</text><path d="M1039.0,153.0 L1370.0,153.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="1168.9" y="142.0" width="71.2" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1204.5" y="158.0" class="al" text-anchor="middle">RDP 3389</text><rect x="20" y="217" width="1600" height="96" rx="10" fill="#FFFFFF" stroke="#E3E6EB"/><text x="36" y="261" class="vn" text-anchor="start">Клиент UDS</text><text x="36" y="281" class="vr" text-anchor="start">из корпоративной сети</text><rect x="330.0" y="243" width="165" height="44" rx="8" fill="#F1F3F6" stroke="#6B7684" stroke-width="2"/><text x="412.5" y="270.0" class="vn" text-anchor="middle">клиент UDS</text><rect x="826.0" y="243" width="213" height="44" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="932.5" y="270.0" class="vn" text-anchor="middle">туннель контура (VIP)</text><rect x="1370.0" y="243" width="165" height="44" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="1452.5" y="270.0" class="vn" text-anchor="middle">стол</text><path d="M495.0,265.0 L826.0,265.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="543.5" y="254.0" width="234.0" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="660.5" y="270.0" class="al" text-anchor="middle">443 · tun.компания.local → VIP</text><path d="M1039.0,265.0 L1370.0,265.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="1168.9" y="254.0" width="71.2" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1204.5" y="270.0" class="al" text-anchor="middle">RDP 3389</text><rect x="20" y="329" width="1600" height="96" rx="10" fill="#F7F9FC" stroke="#E3E6EB"/><text x="36" y="373" class="vn" text-anchor="start">Клиент UDS «напрямую»</text><text x="36" y="393" class="vr" text-anchor="start">(режим для корп. сетей)</text><rect x="330.0" y="355" width="165" height="44" rx="8" fill="#F1F3F6" stroke="#6B7684" stroke-width="2"/><text x="412.5" y="382.0" class="vn" text-anchor="middle">клиент UDS</text><rect x="1370.0" y="355" width="165" height="44" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="1452.5" y="382.0" class="vn" text-anchor="middle">стол</text><path d="M495.0,377.0 L1370.0,377.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="656.4" y="366.0" width="552.2" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="932.5" y="382.0" class="al" text-anchor="middle">RDP 3389 к IP стола: нужен маршрут и правило в группе безопасности столов</text><rect x="20" y="441" width="1600" height="96" rx="10" fill="#FFFFFF" stroke="#E3E6EB"/><text x="36" y="485" class="vn" text-anchor="start">Браузер</text><text x="36" y="505" class="vr" text-anchor="start">(интернет или контур)</text><rect x="330.0" y="467" width="165" height="44" rx="8" fill="#F1F3F6" stroke="#6B7684" stroke-width="2"/><text x="412.5" y="494.0" class="vn" text-anchor="middle">браузер</text><rect x="584.0" y="467" width="177" height="44" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="672.5" y="494.0" class="vn" text-anchor="middle">пограничный фронт</text><rect x="850.0" y="467" width="165" height="44" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="932.5" y="494.0" class="vn" text-anchor="middle">фронт (VIP)</text><rect x="1110.0" y="467" width="165" height="44" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="1192.5" y="494.0" class="vn" text-anchor="middle">шлюз HTML5</text><rect x="1370.0" y="467" width="165" height="44" rx="8" fill="#FFFFFF" stroke="#3A4556" stroke-width="2"/><text x="1452.5" y="494.0" class="vn" text-anchor="middle">стол</text><text x="672.5" y="529" class="vr" text-anchor="middle">только из интернета</text><path d="M495.0,489.0 L584.0,489.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="522.4" y="478.0" width="34.2" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="539.5" y="494.0" class="al" text-anchor="middle">443</text><path d="M761.0,489.0 L850.0,489.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="762.5" y="478.0" width="86.0" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="805.5" y="494.0" class="al" text-anchor="middle">8443 PROXY</text><path d="M1015.0,489.0 L1110.0,489.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="1023.2" y="478.0" width="78.60000000000001" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1062.5" y="494.0" class="al" text-anchor="middle">8080 · WS</text><path d="M1275.0,489.0 L1370.0,489.0" fill="none" stroke="#3A4556" stroke-width="2" marker-end="url(#ah)"/><rect x="1286.9" y="478.0" width="71.2" height="22" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1322.5" y="494.0" class="al" text-anchor="middle">RDP 3389</text><path d="M20,565 h1226 l14,14 v16 h-1240 z" fill="#FFFBE6" stroke="#C9B458"/><text x="30" y="587" class="td">Туннель и шлюз проверяют тикет сеанса у брокера через VIP фронтов (443); брокер принимает тикет только с адреса зарегистрированного узла.</text></svg>